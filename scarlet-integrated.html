<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d18">
  <title>Scarlet 통합 IPA — GitHub 다운로드</title>
  <style>
    :root {color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0d18;color:#f3f0ff}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:25px;box-sizing:border-box}
    main{width:min(100%,570px)}
    h1{font-size:1.75rem;line-height:1.3;margin:0 0 12px}
    p{line-height:1.6;color:#bfb9d2}
    .panel{padding:23px;border:1px solid #45425d;border-radius:24px;background:rgba(36,35,58,.78)}
    .status{font-weight:600;color:#e6d9ff}
    a.action{display:block;margin:15px 0;padding:16px;text-align:center;border-radius:16px;color:#0d0d18;background:#c1aaff;font-weight:700;text-decoration:none}
    a.action[aria-disabled="true"]{background:#525064;color:#c1bccb;pointer-events:none}
    a.text{color:#c1aaff}
    small{display:block;margin-top:16px;color:#bfb9d2;line-height:1.55}
  </style>
</head>
<body>
<main><div class="panel">
  <h1>Scarlet 통합 IPA</h1>
  <p>LiveContainer + SideStore 신규 통합 프로젝트의 GitHub Releases 파일입니다.</p>
  <p class="status" id="status">GitHub 릴리스 파일 확인 중…</p>
  <a id="download" class="action" aria-disabled="true" href="#">IPA 파일 확인 중</a>
  <a id="release" class="text" href="https://github.com/fx564286/sidestore-auto-refresh/releases/tag/scarlet-integrated-unsigned-latest">GitHub 릴리스 페이지 열기</a>
  <small><strong>중요:</strong> 공개되는 통합 파일은 미서명 진단용 IPA입니다. iPhone에서 직접 설치하려면 해당 기기에 유효한 Apple 서명과 프로비저닝 프로파일이 별도로 필요합니다. 기기 설치·로그인·Liquid Glass 실기기 검증은 완료되지 않았습니다.</small>
  <small id="checksum"></small>
</div></main>
<script>
  (async()=>{
    const base="https://api.github.com/repos/fx564286/sidestore-auto-refresh/releases/tags/scarlet-integrated-unsigned-latest";
    const status=document.querySelector("#status"), link=document.querySelector("#download");
    try{
      const response=await fetch(base,{headers:{"Accept":"application/vnd.github+json"},cache:"no-store"});
      if(!response.ok)throw Error("release_not_published");
      const obj=await response.json();
      const ipa=(obj.assets||[]).find(x=>x.name==="Scarlet-Integrated-UNSIGNED.ipa"&&x.size>0);
      const sha=(obj.assets||[]).find(x=>x.name==="Scarlet-Integrated-UNSIGNED.ipa.sha256");
      if(!ipa)throw Error("ipa_not_published");
      link.href=ipa.browser_download_url;
      link.removeAttribute("aria-disabled");
      link.textContent="IPA 직접 다운로드 ("+(ipa.size/1048576).toFixed(1)+" MiB)";
      status.textContent="GitHub 배포 파일 게시 확인";
      if(sha)document.querySelector("#checksum").innerHTML='<a class="text" href="'+sha.browser_download_url+'">SHA-256 검증 파일</a>';
    }catch(e){
      status.textContent="최신 배포 파일이 아직 게시되지 않았습니다.";
      link.textContent="배포 파일 미게시";
    }
  })();
</script>
</body>
</html>
