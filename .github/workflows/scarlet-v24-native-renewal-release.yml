name: Scarlet V24 native SideStore refresh registration direct IPA

on:
  push:
    branches:
      - fix/scarlet-v24-refresh-lifecycle-switch-receipt-20261110
    paths:
      - .github/workflows/scarlet-v24-native-renewal-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  package-verified-v24:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Wait for both V24 native build artifacts (fail closed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 60); do
            names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/42725566852/artifacts" --jq '.artifacts[] | select(.expired == false) | .name' 2>/dev/null || true)"
            if grep -Fxq 'Scarlet-LiveContainer-Native-Engine' <<< "$names" &&
               grep -Fxq 'Scarlet-SideStore-Native-Engine' <<< "$names"; then
              echo "[PASS] both new V24 native engines compiled"
              exit 0
            fi
            echo "[WAIT] V24 LC/SideStore native artifacts $attempt/60"
            sleep 15
          done
          echo "[STOP] missing V24 compiled engine; no IPA release"
          exit 1
      - name: Download actual V24 compiled LiveContainer native engine
        uses: actions/download-artifact@v4
        with:
          name: Scarlet-LiveContainer-Native-Engine
          path: artifacts/lc
          run-id: 42725566852
          github-token: ${{ github.token }}
      - name: Use V24 newly compiled SideStore with embedded managed-app repair
        uses: actions/download-artifact@v4
        with:
          name: Scarlet-SideStore-Native-Engine
          path: artifacts/side
          run-id: 42725566852
          github-token: ${{ github.token }}
      - name: Fail closed on source/pin mismatches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          pins=json.loads(Path("config/scarlet-upstream-pins.json").read_text())
          side=json.loads(Path("artifacts/side/source-gitlink-audit.json").read_text())
          assert side["sourcePins"]==pins, "SideStore source pins changed"
          host=json.loads(Path("artifacts/lc/scarlet-host-integration.json").read_text())
          files={Path(x["path"]).name:x["sha256"] for x in host["sources"]}
          expected=("ScarletIndependentShell.swift","ScarletIntegratedHostView.swift",
                    "ScarletFullscreenGuestTab.swift","ScarletGuestSwitcherOverlay.swift",
                    "ScarletGuestSessionLedger.swift","ScarletNativeGlass.swift",
                    "ScarletSigningReadinessPanel.swift","ScarletAutomaticRenewal.swift",
                    "ScarletFeatureModulesSection.swift")
          for filename in expected:
              path=Path("rebuild/Sources/ScarletIndependentUI" if
                        filename=="ScarletIndependentShell.swift" else "rebuild/HostApp")/filename
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert files.get(filename)==digest, f"Not the V24 compiled code: {filename}"
          assert Path("artifacts/side/SideStore.ipa").stat().st_size>1_000_000
          assert Path("artifacts/lc/LiveContainer-app.tar").stat().st_size>1_000_000
          print("[PASS] V24 exact compiled source hashes and pinned SideStore engine")
          PY
      - name: Prepare official LiveContainer integrated packager
        shell: bash
        run: |
          set -Eeuo pipefail
          brew install ldid
          mkdir -p report build-tools
          curl -fLSs --retry 5 --retry-all-errors --retry-delay 3 \
            https://github.com/LiveContainer/dylibify/releases/download/1.0/dylibify \
            -o build-tools/dylibify
          printf '6d23f6a2fc4d8442f87caa1161aebe6ecaafd0e8c41ce205da007efb04fc82c7  build-tools/dylibify\n' | shasum -a 256 -c -
          chmod +x build-tools/dylibify
          pin="$(python3 -c 'import json;print(json.load(open("config/scarlet-upstream-pins.json"))["LIVE_CONTAINER_REF"])')"
          curl -fLSs --retry 3 \
            "https://raw.githubusercontent.com/LiveContainer/LiveContainer/$pin/.github/sidelc/LCAppInfo.plist" \
            -o build-tools/LCAppInfo.plist
          plutil -lint build-tools/LCAppInfo.plist
      - name: Package and strictly verify V24 unified unsigned IPA
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 rebuild/integration/package_paired.py \
            --lc-tar artifacts/lc/LiveContainer-app.tar \
            --sidestore-ipa artifacts/side/SideStore.ipa \
            --lc-appinfo build-tools/LCAppInfo.plist \
            --dylibify build-tools/dylibify \
            --host-report artifacts/lc/scarlet-host-integration.json \
            --out report
          python3 rebuild/integration/verify_engines.py \
            --phase combined \
            --combined-ipa report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa \
            --report report/combined-ipa-verification.json
          python3 rebuild/scripts/audit_appid_footprint.py \
            --ipa report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa \
            --out report/scarlet-app-id-footprint.json
          cp report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa Scarlet-Crystal-V24-UNSIGNED.ipa
          shasum -a 256 Scarlet-Crystal-V24-UNSIGNED.ipa > Scarlet-Crystal-V24-UNSIGNED.ipa.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("report/scarlet-app-id-footprint.json").read_text())
          print("[APP ID AUDIT]", report)
          assert report["total_bundle_ids"]==4,"Unexpected Apple App ID footprint"
          assert Path("Scarlet-Crystal-V24-UNSIGNED.ipa").stat().st_size>20_000_000
          PY
      - name: Publish permanent direct Safari IPA link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag=scarlet-v24-session-only-switcher-20261110
          cat > release-notes.md <<'EOF'
          Scarlet Crystal V24 — native SideStore refresh registration repair.

          Native Xcode 27.2 build from V24 source commit
          8ecce8475003bdd06d1e771270306563629e24da
          (paired run 42725566852). BOTH LiveContainer/SideStore are rebuilt
          in this run. No older cached SideStore binary may be reused:
          the V24 guest includes the corrected database self-registration
          and real managed-app/certificate XPC inspector.

          Root: embedded SideStore is invoked headlessly in LiveProcess.appex,
          while original SideStore's prepareDatabase() returned early from
          app-extension processes. The authenticated XPC login and LC P12
          alone never established that the SideInstaller-installed Scarlet
          is an InstalledApp managed by SideStore.

          V24 enables ORIGINAL signed-host self registration only for the
          embedded LC LiveProcess path; checks actual registered bundle ID,
          managed app count and SideStore active certificate; invokes the
          native RefreshAllAppsIntent only if managed host is ready.
          Scarlet Settings now exposes the formerly orphaned manual "지금 갱신"
          action and stops falsely showing "요청 중" after login failures.
          Automatic SideStore attempts use the same native readiness check.
          Cold guest switch adds target boot receipt and rollback on failed
          launch requests; all V23 session behavior preserved.

          Existing guest files, Apple credentials, team identity, P12 files,
          Liquid Glass, and 4 app bundle IDs are unchanged.
          UNSIGNED IPA. Apple signing/profile required for iPhone.
          Native Xcode build is NOT proof of on-device seven-day renewal;
          inspect Scarlet managed host and actual re-install receipt on device.
          EOF
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target 8ecce8475003bdd06d1e771270306563629e24da \
              --title "Scarlet Crystal V24 — SideStore embedded refresh registration — UNSIGNED" \
              --prerelease --latest=false --notes-file release-notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            Scarlet-Crystal-V24-UNSIGNED.ipa Scarlet-Crystal-V24-UNSIGNED.ipa.sha256 \
            report/scarlet-app-id-footprint.json --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'Scarlet-Crystal-V24-UNSIGNED.ipa'
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Scarlet-Crystal-V24-UNSIGNED.ipa" >> "$GITHUB_STEP_SUMMARY"
