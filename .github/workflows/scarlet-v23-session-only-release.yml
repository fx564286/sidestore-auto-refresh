name: Scarlet V23 fresh-session guest switcher direct IPA

on:
  push:
    branches:
      - fix/scarlet-v23-session-only-switcher-20261110
    paths:
      - .github/workflows/scarlet-v23-session-only-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  package-verified-v23:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Wait for native V23 compiler artifact (fail closed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 45); do
            id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/42719413202/artifacts" \
              --jq '.artifacts[] | select(.name == "Scarlet-LiveContainer-Native-Engine" and .expired == false) | .id' \
              2>/dev/null | head -1 || true)"
            if [[ -n "$id" ]]; then
              echo "[PASS] exact native V23 compilation artifact id=$id"
              exit 0
            fi
            echo "[WAIT] compiled native artifact not uploaded yet attempt=$attempt/45"
            sleep 15
          done
          echo "[STOP] native V23 artifact unavailable; refusing to publish an IPA"
          exit 1
      - name: Download actual V23 compiled LiveContainer native engine
        uses: actions/download-artifact@v4
        with:
          name: Scarlet-LiveContainer-Native-Engine
          path: artifacts/lc
          run-id: 42719413202
          github-token: ${{ github.token }}
      - name: Reuse exact pinned and already compiled SideStore from V16
        uses: actions/download-artifact@v4
        with:
          name: Scarlet-SideStore-Native-Engine
          path: artifacts/side
          run-id: 42685084334
          github-token: ${{ github.token }}
      - name: Fail closed on source/pin mismatches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          pins=json.loads(Path("config/scarlet-upstream-pins.json").read_text())
          side=json.loads(Path("artifacts/side/source-gitlink-audit.json").read_text())
          assert side["sourcePins"]==pins, "Cached SideStore source pins changed"
          host=json.loads(Path("artifacts/lc/scarlet-host-integration.json").read_text())
          files={Path(x["path"]).name:x["sha256"] for x in host["sources"]}
          expected=("ScarletIndependentShell.swift","ScarletIntegratedHostView.swift",
                    "ScarletFullscreenGuestTab.swift","ScarletGuestSwitcherOverlay.swift",
                    "ScarletGuestSessionLedger.swift","ScarletNativeGlass.swift",
                    "ScarletSigningReadinessPanel.swift","ScarletAutomaticRenewal.swift",
                    "ScarletFeatureModulesSection.swift")
          for filename in expected:
              path=Path("rebuild/Sources/ScarletIndependentUI" if
                        filename=="ScarletIndependentShell.swift" else "rebuild/HostApp")/filename
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert files.get(filename)==digest, f"Not the V23 compiled code: {filename}"
          assert Path("artifacts/side/SideStore.ipa").stat().st_size>1_000_000
          assert Path("artifacts/lc/LiveContainer-app.tar").stat().st_size>1_000_000
          print("[PASS] V23 exact compiled source hashes and pinned SideStore engine")
          PY
      - name: Prepare official LiveContainer integrated packager
        shell: bash
        run: |
          set -Eeuo pipefail
          brew install ldid
          mkdir -p report build-tools
          curl -fLSs --retry 5 --retry-all-errors --retry-delay 3 \
            https://github.com/LiveContainer/dylibify/releases/download/1.0/dylibify \
            -o build-tools/dylibify
          printf '6d23f6a2fc4d8442f87caa1161aebe6ecaafd0e8c41ce205da007efb04fc82c7  build-tools/dylibify\n' | shasum -a 256 -c -
          chmod +x build-tools/dylibify
          pin="$(python3 -c 'import json;print(json.load(open("config/scarlet-upstream-pins.json"))["LIVE_CONTAINER_REF"])')"
          curl -fLSs --retry 3 \
            "https://raw.githubusercontent.com/LiveContainer/LiveContainer/$pin/.github/sidelc/LCAppInfo.plist" \
            -o build-tools/LCAppInfo.plist
          plutil -lint build-tools/LCAppInfo.plist
      - name: Package and strictly verify V23 unified unsigned IPA
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 rebuild/integration/package_paired.py \
            --lc-tar artifacts/lc/LiveContainer-app.tar \
            --sidestore-ipa artifacts/side/SideStore.ipa \
            --lc-appinfo build-tools/LCAppInfo.plist \
            --dylibify build-tools/dylibify \
            --host-report artifacts/lc/scarlet-host-integration.json \
            --out report
          python3 rebuild/integration/verify_engines.py \
            --phase combined \
            --combined-ipa report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa \
            --report report/combined-ipa-verification.json
          python3 rebuild/scripts/audit_appid_footprint.py \
            --ipa report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa \
            --out report/scarlet-app-id-footprint.json
          cp report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa Scarlet-Crystal-V23-UNSIGNED.ipa
          shasum -a 256 Scarlet-Crystal-V23-UNSIGNED.ipa > Scarlet-Crystal-V23-UNSIGNED.ipa.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("report/scarlet-app-id-footprint.json").read_text())
          print("[APP ID AUDIT]", report)
          assert report["total_bundle_ids"]==4,"Unexpected Apple App ID footprint"
          assert Path("Scarlet-Crystal-V23-UNSIGNED.ipa").stat().st_size>20_000_000
          PY
      - name: Publish permanent direct Safari IPA link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag=scarlet-v23-runtime-identity-20261110
          cat > release-notes.md <<'EOF'
          Scarlet Crystal V23 — no stale Instagram from previous work sessions.

          Xcode 27.2 native LiveContainer V23 source commit
          520f705f108ba72974169ea9f9ed233e3e8a01ca (CI 42719413202),
          combined with exact pinned, previously audited SideStore native binary.
          Original sources and corresponding native compilation output SHA256
          are compared before IPA packaging and release.

          iPhone V22 SourceCommit 4630e21113e1 proved running KakaoTalk
          resolved to one active guest but panel showed two: the old V19
          30-minute history leaked Instagram into a new session.
          V23 uses a fresh work-session ledger V23. Starting Scarlet
          independently clears only the switcher tabs. Returning from a
          guest via Scarlet's own App List button uses a one-time, short-
          lived return ticket to retain A then add B in the same session.
          No arbitrary 30-minute expiration.

          Previous V14/V19 ledgers are not deleted or migrated, and guest
          apps, data, saved signing certificates, App Group, Liquid Glass,
          icons, orientation handling, and 4 Apple App IDs remain intact.

          UNSIGNED IPA. Valid Apple signing and provisioning required.
          Real iPhone switching and automatic 7-day signing renewal
          remain independent device acceptance checks.
          EOF
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target 520f705f108ba72974169ea9f9ed233e3e8a01ca \
              --title "Scarlet Crystal V23 — correct running guest identity — UNSIGNED" \
              --prerelease --latest=false --notes-file release-notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            Scarlet-Crystal-V23-UNSIGNED.ipa Scarlet-Crystal-V23-UNSIGNED.ipa.sha256 \
            report/scarlet-app-id-footprint.json --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'Scarlet-Crystal-V23-UNSIGNED.ipa'
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Scarlet-Crystal-V23-UNSIGNED.ipa" >> "$GITHUB_STEP_SUMMARY"
