name: Scarlet R6P121 actual iPhone Simulator UI evidence

on:
  workflow_dispatch:
  push:
    branches:
      - ci/scarlet-r6p121-iphone-simulator-20261120

permissions:
  contents: read

concurrency:
  group: scarlet-r6p121-iphone-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-simulator-ui:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2 and inspect CoreSimulator availability
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"
      - name: Verify R6P121 certificate recovery contracts and simulator selector
        shell: bash
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          xcrun simctl list devices available
          python3 -m unittest discover -s rebuild/Tests -p 'test_v48_r6p121_existing_p12_after_issue_failure.py' -v
          python3 -m unittest discover -s rebuild/Tests -p 'test_simulator_responsive_selection.py' -v
          python3 rebuild/diagnostics/scarlet_no_repeat_gate.py
      - name: Boot genuine iPhone Simulator and capture five SwiftUI preview screens
        shell: bash
        timeout-minutes: 16
        run: |
          set -Eeuo pipefail
          bash rebuild/scripts/capture_simulator_ui.sh "$RUNNER_TEMP/scarlet-r6p121-simulator"
          test -s "$RUNNER_TEMP/scarlet-r6p121-simulator/simulator-selection.json"
          test -s "$RUNNER_TEMP/scarlet-r6p121-simulator/metadata.json"
          python3 - "$RUNNER_TEMP/scarlet-r6p121-simulator" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          selected = json.loads((path / "simulator-selection.json").read_text())
          report = json.loads((path / "metadata.json").read_text())
          assert selected["status"] == "ready", selected
          assert report["renderKind"] == "isolated_swiftui_simulator_preview", report
          assert not report["originalHostIntegrated"]
          assert not report["appleLoginVerified"]
          assert len(report["images"]) == 5, report
          print("[PASS] Five actual iPhone Simulator screenshots; mock UI only; native Scarlet/Apple ID NOT verified")
          PY
      - name: Preserve screenshots and simulator failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Scarlet-R6P121-Actual-iPhone-Simulator-UI-Preview-Only
          path: ${{ runner.temp }}/scarlet-r6p121-simulator/
          retention-days: 14
          if-no-files-found: warn
