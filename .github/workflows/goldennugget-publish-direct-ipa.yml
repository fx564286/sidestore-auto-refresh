name: Publish GoldenNugget Direct IPA

on:
  push:
    branches:
      - build/goldennugget-community-ko-complete-20261114
    paths:
      - .github/workflows/goldennugget-publish-direct-ipa.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release-ipa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the verified Xcode 27 IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/GoldenNugget"
          gh run download 43466480798 \
            --repo fx564286/sidestore-auto-refresh \
            --name GoldenNugget-9.7.5-Korean-Community-Duo-Final-unsigned \
            --dir "$RUNNER_TEMP/GoldenNugget"
          src="$RUNNER_TEMP/GoldenNugget/GoldenNuggetMobile.ipa"
          test -s "$src"
          unzip -t "$src" | tail -2
          cp "$src" "$RUNNER_TEMP/GoldenNugget.ipa"
          shasum -a 256 "$RUNNER_TEMP/GoldenNugget.ipa"

      - name: Publish an actual .ipa asset (not GitHub Actions ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=goldennugget-ko-duo-20261114
          if gh release view "$tag" -R fx564286/sidestore-auto-refresh >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/GoldenNugget.ipa" -R fx564286/sidestore-auto-refresh --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/GoldenNugget.ipa" \
              --repo fx564286/sidestore-auto-refresh \
              --target 555df8071763a5c3f39fac171deacaf48a2dbb02 \
              --title "GoldenNugget 9.7.5 Korean Duo / Find My 211" \
              --notes "Unsigned IPA built by Xcode 27. Includes source-level Korean Duo catalog display, Find My 211 diagnostics, and optional iOS 27 backup skip. GitHub raw build artifact. Korean resource-only translations from the chat attachment are not included in this standalone release."
          fi
          gh release view "$tag" -R fx564286/sidestore-auto-refresh --json assets --jq '.assets[] | .name + " " + .url'
