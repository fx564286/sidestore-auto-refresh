name: Scarlet V22 runtime guest identity direct IPA

on:
  push:
    branches:
      - fix/scarlet-v22-runtime-guest-identity-20261110
    paths:
      - .github/workflows/scarlet-v22-runtime-identity-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  package-verified-v22:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Wait for native V22 compiler artifact (fail closed)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 45); do
            id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/42715664488/artifacts" \
              --jq '.artifacts[] | select(.name == "Scarlet-LiveContainer-Native-Engine" and .expired == false) | .id' \
              2>/dev/null | head -1 || true)"
            if [[ -n "$id" ]]; then
              echo "[PASS] exact native V22 compilation artifact id=$id"
              exit 0
            fi
            echo "[WAIT] compiled native artifact not uploaded yet attempt=$attempt/45"
            sleep 15
          done
          echo "[STOP] native V22 artifact unavailable; refusing to publish an IPA"
          exit 1
      - name: Download actual V22 compiled LiveContainer native engine
        uses: actions/download-artifact@v4
        with:
          name: Scarlet-LiveContainer-Native-Engine
          path: artifacts/lc
          run-id: 42715664488
          github-token: ${{ github.token }}
      - name: Reuse exact pinned and already compiled SideStore from V16
        uses: actions/download-artifact@v4
        with:
          name: Scarlet-SideStore-Native-Engine
          path: artifacts/side
          run-id: 42685084334
          github-token: ${{ github.token }}
      - name: Fail closed on source/pin mismatches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          pins=json.loads(Path("config/scarlet-upstream-pins.json").read_text())
          side=json.loads(Path("artifacts/side/source-gitlink-audit.json").read_text())
          assert side["sourcePins"]==pins, "Cached SideStore source pins changed"
          host=json.loads(Path("artifacts/lc/scarlet-host-integration.json").read_text())
          files={Path(x["path"]).name:x["sha256"] for x in host["sources"]}
          expected=("ScarletIndependentShell.swift","ScarletIntegratedHostView.swift",
                    "ScarletFullscreenGuestTab.swift","ScarletGuestSwitcherOverlay.swift",
                    "ScarletGuestSessionLedger.swift","ScarletNativeGlass.swift",
                    "ScarletSigningReadinessPanel.swift","ScarletAutomaticRenewal.swift",
                    "ScarletFeatureModulesSection.swift")
          for filename in expected:
              path=Path("rebuild/Sources/ScarletIndependentUI" if
                        filename=="ScarletIndependentShell.swift" else "rebuild/HostApp")/filename
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert files.get(filename)==digest, f"Not the V22 compiled code: {filename}"
          assert Path("artifacts/side/SideStore.ipa").stat().st_size>1_000_000
          assert Path("artifacts/lc/LiveContainer-app.tar").stat().st_size>1_000_000
          print("[PASS] V22 exact compiled source hashes and pinned SideStore engine")
          PY
      - name: Prepare official LiveContainer integrated packager
        shell: bash
        run: |
          set -Eeuo pipefail
          brew install ldid
          mkdir -p report build-tools
          curl -fLSs --retry 5 --retry-all-errors --retry-delay 3 \
            https://github.com/LiveContainer/dylibify/releases/download/1.0/dylibify \
            -o build-tools/dylibify
          printf '6d23f6a2fc4d8442f87caa1161aebe6ecaafd0e8c41ce205da007efb04fc82c7  build-tools/dylibify\n' | shasum -a 256 -c -
          chmod +x build-tools/dylibify
          pin="$(python3 -c 'import json;print(json.load(open("config/scarlet-upstream-pins.json"))["LIVE_CONTAINER_REF"])')"
          curl -fLSs --retry 3 \
            "https://raw.githubusercontent.com/LiveContainer/LiveContainer/$pin/.github/sidelc/LCAppInfo.plist" \
            -o build-tools/LCAppInfo.plist
          plutil -lint build-tools/LCAppInfo.plist
      - name: Package and strictly verify V22 unified unsigned IPA
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 rebuild/integration/package_paired.py \
            --lc-tar artifacts/lc/LiveContainer-app.tar \
            --sidestore-ipa artifacts/side/SideStore.ipa \
            --lc-appinfo build-tools/LCAppInfo.plist \
            --dylibify build-tools/dylibify \
            --host-report artifacts/lc/scarlet-host-integration.json \
            --out report
          python3 rebuild/integration/verify_engines.py \
            --phase combined \
            --combined-ipa report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa \
            --report report/combined-ipa-verification.json
          python3 rebuild/scripts/audit_appid_footprint.py \
            --ipa report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa \
            --out report/scarlet-app-id-footprint.json
          cp report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa Scarlet-Crystal-V22-UNSIGNED.ipa
          shasum -a 256 Scarlet-Crystal-V22-UNSIGNED.ipa > Scarlet-Crystal-V22-UNSIGNED.ipa.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("report/scarlet-app-id-footprint.json").read_text())
          print("[APP ID AUDIT]", report)
          assert report["total_bundle_ids"]==4,"Unexpected Apple App ID footprint"
          assert Path("Scarlet-Crystal-V22-UNSIGNED.ipa").stat().st_size>20_000_000
          PY
      - name: Publish permanent direct Safari IPA link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag=scarlet-v22-runtime-identity-20261110
          cat > release-notes.md <<'EOF'
          Scarlet Crystal V22 — correctly classify current LC guest by runtime bundle ID.

          Xcode 27.2 V22 native engine compiled from source commit
          4630e21113e109c8909c716f7cd6377e11b0eb26 (CI 42715664488).
          Pinned SideStore source and unchanged V16 compiled engine were audited
          with SHA256 source checks before packaging.
          Previous V21 iPhone report had panel_opened(count=2) but the
          current app could be classified as cold: LiveContainer consumes
          selected launch keys and guest standard UserDefaults is virtualized.
          V22 passes NSUserDefaults.lcGuestAppId from active TweakLoader to
          the switcher, compares against real guest bundle identifiers, and
          rejects cold self-relaunch.
          The menu retains the current app, A/Home/B launch history, icons,
          V21 tracing/rotation and original native Liquid Glass unchanged.
          Running-in-memory state is still only promised for live native scenes.
          iPhone classic guest history is a cold relaunch list, not RAM multitasking.
          Four Apple App IDs preserved, no guest data, P12 or profile removed.

          UNSIGNED IPA: requires valid Apple signing/provisioning before
          installation. No physical iPhone acceptance or 7-day auto renewal
          is claimed by this CI build.
          EOF
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target 4630e21113e109c8909c716f7cd6377e11b0eb26 \
              --title "Scarlet Crystal V22 — correct running guest identity — UNSIGNED" \
              --prerelease --latest=false --notes-file release-notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            Scarlet-Crystal-V22-UNSIGNED.ipa Scarlet-Crystal-V22-UNSIGNED.ipa.sha256 \
            report/scarlet-app-id-footprint.json --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'Scarlet-Crystal-V22-UNSIGNED.ipa'
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Scarlet-Crystal-V22-UNSIGNED.ipa" >> "$GITHUB_STEP_SUMMARY"
