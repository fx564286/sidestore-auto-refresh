name: Scarlet paired LiveContainer and SideStore iOS build

on:
  workflow_dispatch:
  push:
    branches: [rebuild/scarlet-from-zero-20261106]
    paths:
      - ".github/workflows/scarlet-paired-engines-build.yml"
      - "rebuild/integration/**"

permissions:
  contents: read

concurrency:
  group: scarlet-engines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  livecontainer:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"
      - name: Fetch exact pinned LiveContainer with all native app extensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          pin="$(python3 -c 'import json;print(json.load(open("config/scarlet-upstream-pins.json"))["LIVE_CONTAINER_REF"])')"
          git clone --filter=blob:none https://github.com/LiveContainer/LiveContainer.git engine/LiveContainer
          git -C engine/LiveContainer checkout --detach "$pin"
          git -C engine/LiveContainer submodule update --init --recursive --jobs 3
          test "$(git -C engine/LiveContainer rev-parse HEAD)" = "$pin"
          echo "$pin" > report/livecontainer-commit.txt
          echo "[PASS] Pinned LiveContainer source"
      - name: Build LiveContainer with integrated SideStoreSupport for real iOS
        shell: bash
        run: |
          set -uo pipefail
          cd engine/LiveContainer
          xcodebuild -version
          xcodebuild archive -project LiveContainer.xcodeproj -scheme LiveContainer \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ScarletLiveContainer" -jobs 2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > "$GITHUB_WORKSPACE/report/livecontainer-build.log" 2>&1
          status=$?
          echo "$status" > "$GITHUB_WORKSPACE/report/livecontainer-exit.txt"
          if [ "$status" -ne 0 ]; then
            grep -n -m 25 -E 'error:|fatal error:|BUILD FAILED|ARCHIVE FAILED' "$GITHUB_WORKSPACE/report/livecontainer-build.log" || true
            exit "$status"
          fi
          app="$RUNNER_TEMP/ScarletLiveContainer.xcarchive/Products/Applications/LiveContainer.app"
          test -d "$app" || exit 1
          python3 "$GITHUB_WORKSPACE/rebuild/integration/verify_engines.py" \
            --livecontainer "$app" --phase livecontainer \
            --report "$GITHUB_WORKSPACE/report/livecontainer-audit.json"
          tar -cf "$GITHUB_WORKSPACE/report/LiveContainer-app.tar" -C "$(dirname "$app")" LiveContainer.app
          echo "[PASS] Compiled LiveContainer host, 3 native extensions and SideStoreSupport"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Scarlet-LiveContainer-Native-Engine
          path: report/
          retention-days: 14
          if-no-files-found: warn

  sidestore:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"
      - name: Checkout pinned SideStore and verify SideSign/minimuxer gitlinks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          pin="$(python3 -c 'import json;print(json.load(open("config/scarlet-upstream-pins.json"))["EMBEDDED_SIDESTORE_REF"])')"
          git clone --filter=blob:none https://github.com/LiveContainer/SideStore.git engine/SideStore
          git -C engine/SideStore checkout --detach "$pin"
          git -C engine/SideStore submodule update --init --recursive --jobs 3
          python3 rebuild/integration/verify_engines.py \
            --sidestore-source engine/SideStore --phase pins \
            --report report/source-gitlink-audit.json
      - name: Install SideStore official build prerequisite
        shell: bash
        run: brew install ldid
      - name: Build pinned SideStore with real installer, resign and refresh code
        shell: bash
        run: |
          set -uo pipefail
          cd engine/SideStore
          make build > "$GITHUB_WORKSPACE/report/sidestore-build.log" 2>&1
          status=$?
          echo "$status" > "$GITHUB_WORKSPACE/report/sidestore-exit.txt"
          if [ "$status" -ne 0 ]; then
            grep -n -m 25 -E 'error:|fatal error:|BUILD FAILED|ARCHIVE FAILED' "$GITHUB_WORKSPACE/report/sidestore-build.log" || true
            exit "$status"
          fi
          test -d SideStore.xcarchive/Products/Applications/SideStore.app || exit 1
          make ipa > "$GITHUB_WORKSPACE/report/sidestore-package.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -50 "$GITHUB_WORKSPACE/report/sidestore-package.log"
            exit "$status"
          fi
          cp SideStore.ipa "$GITHUB_WORKSPACE/report/SideStore.ipa"
          python3 "$GITHUB_WORKSPACE/rebuild/integration/verify_engines.py" \
            --sidestore-source "$PWD" \
            --sidestore-ipa "$GITHUB_WORKSPACE/report/SideStore.ipa" \
            --phase sidestore --report "$GITHUB_WORKSPACE/report/sidestore-audit.json"
          echo "[PASS] Compiled SideStore with source-proven install/sign/refresh pipeline"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Scarlet-SideStore-Native-Engine
          path: report/
          retention-days: 14
          if-no-files-found: warn
