      - "rebuild/diagnostics/**"
      - ".github/workflows/scarlet-paired-engines-build.yml"

permissions:
  contents: read

concurrency:
  group: scarlet-engines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  livecontainer:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"
      - name: Validate modular feature controls and signing footprint contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          # Fail closed before any native engine integration or archive.
          python3 rebuild/diagnostics/scarlet_no_repeat_gate.py --repository-check \
            | tee report/scarlet-no-repeat-gate.log
          python3 -m unittest discover -s rebuild/Tests -p 'test_*.py' \
            > report/scarlet-regression-tests.log 2>&1 || {
              tail -90 report/scarlet-regression-tests.log
              exit 1
            }
          tail -4 report/scarlet-regression-tests.log
      - name: Fetch exact pinned LiveContainer with all native app extensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          pin="$(python3 -c 'import json;print(json.load(open("config/scarlet-upstream-pins.json"))["LIVE_CONTAINER_REF"])')"
          git clone --filter=blob:none https://github.com/LiveContainer/LiveContainer.git engine/LiveContainer
          git -C engine/LiveContainer checkout --detach "$pin"
          git -C engine/LiveContainer submodule update --init --recursive --jobs 3
          test "$(git -C engine/LiveContainer rev-parse HEAD)" = "$pin"
          echo "$pin" > report/livecontainer-commit.txt
          # V14 slim IPA removed ShareExtension, but LaunchAppExtension
          # instantiates that extension directly for every Launch App intent.
          # Fail closed against losing Shortcuts while reducing Apple IDs.
          grep -Fq 'appendingPathExtension("ShareExtension")'             engine/LiveContainer/LaunchAppExtension/LaunchAppExtension.swift
          test -f engine/LiveContainer/ShareExtension/ShareExtensionHandler.swift
          echo "[PASS] Pinned Launch App shortcut still requires ShareExtension"
          echo "[PASS] Pinned LiveContainer source"
      - name: Integrate original LC guest engine with new Figma shell and V131 native glass
        shell: bash
        run: |
          set -euo pipefail
          python3 rebuild/integration/wire_scarlet_auth.py --engine engine/LiveContainer --mode livecontainer
          python3 rebuild/integration/apply_scarlet_host.py \
            --engine engine/LiveContainer \
            --report report/scarlet-host-integration.json
      - name: Compile pinned StikPair remote-pairing Rust library (no extra App IDs)
        shell: bash
        run: |
          set -Eeuo pipefail
          pin="7c911d8319dc5bcc411bf299d963689e26009b0b"
          git clone --filter=blob:none https://github.com/StikDebug/StikPair.git engine/StikPair
          git -C engine/StikPair checkout --detach "$pin"
          test "$(git -C engine/StikPair rev-parse HEAD)" = "$pin"
          cargo --version
          rustup target add aarch64-apple-ios
          cd engine/StikPair/rust
          IPHONEOS_DEPLOYMENT_TARGET=17.4 cargo build --release --locked --target aarch64-apple-ios \
            > "$GITHUB_WORKSPACE/report/scarlet-rppairing-rust-build.log" 2>&1 || {
              tail -95 "$GITHUB_WORKSPACE/report/scarlet-rppairing-rust-build.log"
              exit 1
            }
          echo "[PASS] genuine iOS27 native RPPairing host FFI compiled"
          cd "$GITHUB_WORKSPACE"
          python3 rebuild/integration/link_scarlet_pairing.py \
            --engine engine/LiveContainer \
            --stikpair engine/StikPair \
            --report report/scarlet-pairing-integration.json
      - name: Build LiveContainer with integrated SideStoreSupport for real iOS
        shell: bash
        run: |
          set -uo pipefail
          cd engine/LiveContainer
          xcodebuild -version
          xcodebuild archive -project LiveContainer.xcodeproj -scheme LiveContainer \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ScarletLiveContainer" -jobs 2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > "$GITHUB_WORKSPACE/report/livecontainer-build.log" 2>&1
          status=$?
          echo "$status" > "$GITHUB_WORKSPACE/report/livecontainer-exit.txt"
          if [ "$status" -ne 0 ]; then
            grep -n -m 25 -E 'error:|fatal error:|BUILD FAILED|ARCHIVE FAILED' "$GITHUB_WORKSPACE/report/livecontainer-build.log" || true
            exit "$status"
          fi
          app="$RUNNER_TEMP/ScarletLiveContainer.xcarchive/Products/Applications/LiveContainer.app"
          test -d "$app" || exit 1
          # File-synchronized Xcode Resources are not guaranteed to copy
          # stand-alone .txt notices into the archived .app. Make the pinned
          # StikPair license an actual IPA resource before tar/packaging.
          notice="$GITHUB_WORKSPACE/engine/LiveContainer/Resources/ScarletPairingThirdParty-LICENSE.txt"
          test -s "$notice" || { echo "[STOP] StikPair attribution missing"; exit 1; }
          cp "$notice" "$app/ScarletPairingThirdParty-LICENSE.txt"
          cmp "$notice" "$app/ScarletPairingThirdParty-LICENSE.txt"
          grep -Fq 'StephenDev0' "$app/ScarletPairingThirdParty-LICENSE.txt"
          echo "[PASS] V29 original StikPair license embedded in app archive"
          python3 "$GITHUB_WORKSPACE/rebuild/integration/verify_engines.py" \
            --livecontainer "$app" --phase livecontainer \
            --report "$GITHUB_WORKSPACE/report/livecontainer-audit.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path(os.environ["GITHUB_WORKSPACE"])
          p=root/"report/scarlet-host-integration.json"
          data=json.loads(p.read_text())
          log=(root/"report/livecontainer-build.log").read_text(errors="replace")
          required=("ScarletIntegratedHostView.swift", "ScarletNativeGlass.swift",
                    "ScarletFeatureModulesSection.swift", "ScarletAutomaticRenewal.swift",
                    "ScarletGuestSessionLedger.swift",
                    "ScarletGuestSwitcherOverlay.swift",
                    "ScarletFullscreenGuestTab.swift",
                    "ScarletIndependentShell.swift")
          missing=[x for x in required if x not in log]
          assert not missing, "Original Xcode sources absent from build log: "+str(missing)
          data["newRootCompiled"]=True
          p.write_text(json.dumps(data,indent=2)+"\n")
          print("[PASS] New Figma shell and UIKit UIGlassEffect source compiled into native host")
          PY
          tar -cf "$GITHUB_WORKSPACE/report/LiveContainer-app.tar" -C "$(dirname "$app")" LiveContainer.app
          echo "[PASS] Compiled LiveContainer host, 3 native extensions and SideStoreSupport"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Scarlet-LiveContainer-Native-Engine
          path: report/
          retention-days: 14
          if-no-files-found: warn

  sidestore:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"
      - name: Enforce immutable P15 history and per-commit audit coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 rebuild/diagnostics/scarlet_no_repeat_gate.py --repository-check
      - name: Checkout pinned SideStore and verify SideSign/minimuxer gitlinks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          pin="$(python3 -c 'import json;print(json.load(open("config/scarlet-upstream-pins.json"))["EMBEDDED_SIDESTORE_REF"])')"
          git clone --filter=blob:none https://github.com/LiveContainer/SideStore.git engine/SideStore
          git -C engine/SideStore checkout --detach "$pin"
          git -C engine/SideStore submodule update --init --recursive --jobs 3
          python3 rebuild/integration/verify_engines.py \
            --sidestore-source engine/SideStore --phase pins \
            --report report/source-gitlink-audit.json
          python3 rebuild/integration/wire_scarlet_auth.py --engine engine/SideStore --mode sidestore
      - name: Install SideStore official build prerequisite
        shell: bash
        run: brew install ldid
      - name: Build pinned SideStore with real installer, resign and refresh code
        shell: bash
        run: |
          set -uo pipefail
          cd engine/SideStore
          make build > "$GITHUB_WORKSPACE/report/sidestore-build.log" 2>&1
          status=$?
          echo "$status" > "$GITHUB_WORKSPACE/report/sidestore-exit.txt"
          if [ "$status" -ne 0 ]; then
            grep -n -m 25 -E 'error:|fatal error:|BUILD FAILED|ARCHIVE FAILED' "$GITHUB_WORKSPACE/report/sidestore-build.log" || true
            exit "$status"
          fi
          test -d SideStore.xcarchive/Products/Applications/SideStore.app || exit 1
          make ipa > "$GITHUB_WORKSPACE/report/sidestore-package.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -50 "$GITHUB_WORKSPACE/report/sidestore-package.log"
            exit "$status"
          fi
          cp SideStore.ipa "$GITHUB_WORKSPACE/report/SideStore.ipa"
          python3 "$GITHUB_WORKSPACE/rebuild/integration/verify_engines.py" \
            --sidestore-source "$PWD" \
            --sidestore-ipa "$GITHUB_WORKSPACE/report/SideStore.ipa" \
            --phase sidestore --report "$GITHUB_WORKSPACE/report/sidestore-audit.json"
          echo "[PASS] Compiled SideStore with source-proven install/sign/refresh pipeline"
      # Only publish a reusable native-engine artifact after SideStore.ipa
      # and all build verification steps succeed. Failed attempts previously
      # uploaded an artifact with the SAME name but without SideStore.ipa;
      # a re-run then downloaded that stale/incomplete artifact by name.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Scarlet-SideStore-Native-Engine
          path: report/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Scarlet-SideStore-Failure-Logs-attempt-${{ github.run_attempt }}
          path: report/
          retention-days: 14
          if-no-files-found: warn

  package-paired:
    needs: [livecontainer, sidestore]
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Scarlet-LiveContainer-Native-Engine
          path: artifacts/lc
      - uses: actions/download-artifact@v4
        with:
          name: Scarlet-SideStore-Native-Engine
          path: artifacts/side
      - name: Prepare exact official LiveContainer embedded-SideStore packaging tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report build-tools
          brew install ldid
          curl -fLSs --retry 3 \
            https://github.com/LiveContainer/dylibify/releases/download/1.0/dylibify \
            -o build-tools/dylibify
          chmod +x build-tools/dylibify
          file build-tools/dylibify
          pin="$(python3 -c 'import json;print(json.load(open("config/scarlet-upstream-pins.json"))["LIVE_CONTAINER_REF"])')"
          curl -fLSs --retry 3 \
            "https://raw.githubusercontent.com/LiveContainer/LiveContainer/$pin/.github/sidelc/LCAppInfo.plist" \
            -o build-tools/LCAppInfo.plist
          plutil -lint build-tools/LCAppInfo.plist
          shasum -a 256 build-tools/dylibify | tee report/official-dylibify-sha256.txt
      - name: Produce separate and unified native engine IPAs without altering Apple signing assets
        shell: bash
        run: |
          set -euo pipefail
          # A completed workflow job is not proof that the downloaded artifact
          # contains the binary; block incomplete/stale artifacts explicitly.
          test -s artifacts/side/SideStore.ipa || {
            echo "[BLOCK] Missing verified SideStore.ipa in downloaded artifact" >&2
            find artifacts/side -maxdepth 2 -type f -print >&2
            exit 1
          }
          test -s artifacts/lc/LiveContainer-app.tar || {
            echo "[BLOCK] Missing compiled LiveContainer-app.tar" >&2
            exit 1
          }
          python3 rebuild/integration/package_paired.py \
            --lc-tar artifacts/lc/LiveContainer-app.tar \
            --sidestore-ipa artifacts/side/SideStore.ipa \
            --lc-appinfo build-tools/LCAppInfo.plist \
            --dylibify build-tools/dylibify \
            --host-report artifacts/lc/scarlet-host-integration.json \
            --out report
          python3 rebuild/integration/verify_engines.py \
            --phase combined \
            --combined-ipa report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa \
            --report report/combined-ipa-verification.json
          python3 rebuild/scripts/audit_appid_footprint.py \
            --ipa report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa \
            --out report/scarlet-app-id-footprint.json
          echo "[PASS] Pinned SideStore embedded, no new App IDs or unknown .appex; user installation not performed."
      - name: Upload exact binary artifacts and signing limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Scarlet-Paired-Engines-UNSIGNED-DIAGNOSTIC-ONLY
          path: report/
          if-no-files-found: warn
          retention-days: 14


  # GitHub Actions artifact links expire and may require authentication.
  # A Release asset in this public repo has a stable public download URL.
  publish-unsigned-github-release:
