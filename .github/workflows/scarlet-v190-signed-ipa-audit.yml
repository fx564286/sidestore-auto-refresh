name: Scarlet V190 published IPA profile audit (read-only)
on:
  push:
    branches:
      - fix/scarlet-v190-auth-transport-20261106
    paths:
      - support/audit_signed_ipa_provisioning.py
      - .github/workflows/scarlet-v190-signed-ipa-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download exact published signed IPA files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published reports
          python3 -m py_compile support/audit_signed_ipa_provisioning.py
          for v in 189 190; do
            tag="scarlet-v${v}-device-signed-20261105"
            file="Scarlet-Crystal-V${v}-SIGNED-DEVELOPMENT.ipa"
            gh release download "$tag" -R "$GITHUB_REPOSITORY" --dir published --pattern "$file"
            actual="$(sha256sum "published/$file" | awk '{print $1}')"
            expected="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name==\"$file\") | .digest" | sed 's/^sha256://')"
            test "$actual" = "$expected" || { echo "[FAIL] V$v release digest mismatch"; exit 1; }
            echo "[PASS] V$v public release SHA256"
          done
      - name: Audit bundle, provisioning, App Group and OTA eligibility
        shell: bash
        run: |
          set -euo pipefail
          python3 support/audit_signed_ipa_provisioning.py \
            published/Scarlet-Crystal-V189-SIGNED-DEVELOPMENT.ipa \
            published/Scarlet-Crystal-V190-SIGNED-DEVELOPMENT.ipa \
            > reports/v189-v190-signed-ipa-provisioning.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("reports/v189-v190-signed-ipa-provisioning.json").read_text())
          assert len(data)==2
          for record,build,label in zip(data,("3.8.203","3.8.204"),("V189","V190")):
              assert record["host_build"]==build, record
              assert record["host_label"]==label, record
              print("[IPA]",label,"host_build",build,
                  "bundles",len(record["targets"]),
                  "profile_consistency",record["profile_consistency"],
                  "safari_ota_distribution_profile_all_targets",
                  record["safari_ota_distribution_profile_all_targets"])
              for item in record["targets"]:
                  print("[BUNDLE]",label,item["bundle"],
                    "profile",item["profile_kind"],
                    "app_group_present",item["application_groups_present"],
                    "id_match",item["application_identifier_matches"],
                    "expired",item["profile_expired"])
          print("[NOTICE] Code signing cryptographic verification and iPhone install not performed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Scarlet-V189-V190-IPA-Provisioning-ReadOnly-Audit
          path: reports/
          if-no-files-found: warn
