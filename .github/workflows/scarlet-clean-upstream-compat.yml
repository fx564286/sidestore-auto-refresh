name: Scarlet Clean - verify automated upstream candidate

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Immutable auto-generated source integration branch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scarlet-clean-upstream-verify-${{ inputs.candidate_ref }}
  cancel-in-progress: false

jobs:
  source-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Reject arbitrary or unstable source branches
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^automation/scarlet-clean-upstream-[0-9a-f]{12}$ ]] || {
            echo "[STOP] Only immutable generated Scarlet upstream candidate branches permitted" >&2
            exit 2
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false

      - name: Verify parent SHA and SideSign gitlink consistency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_v177_upstream_follow.py -v
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("upstream",Path("scripts/scarlet_upstream_follow.py"))
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          pins=json.loads(Path("config/scarlet-upstream-pins.json").read_text())
          assert set(pins)==set(m.UPSTREAMS)|set(m.SUBMODULES)
          for key,value in pins.items():m.sha(value)
          side=pins["EMBEDDED_SIDESTORE_REF"]
          tree=m.api_get(f"https://api.github.com/repos/LiveContainer/SideStore/git/trees/{side}?recursive=1")
          assert not tree.get("truncated"), "SideStore git tree unexpectedly truncated"
          entries={x["path"]:x for x in tree.get("tree",[]) if x.get("mode")=="160000"}
          for key,path in m.SUBMODULES.items():
              entry=entries.get(path)
              assert entry is not None and entry.get("sha")==pins[key], f"{key} mismatched pinned SideStore parent"
          print("[PASS] PAIRED_UPSTREAM_PINS_AND_SIDESIGN_GITLINKS")
          PY

      - name: Regression: independent UI and preserved Liquid Glass boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool rebuild/config/scarlet-independent-ui-contract.json >/dev/null
          python3 -m unittest discover -s rebuild/Tests -p test_independent_ui_contract.py -v
          python3 -m py_compile scripts/scarlet_upstream_follow.py
          echo "[PASS] INDEPENDENT_DESIGN_NO_NATIVE_GLASS_REPLACEMENT"

      - name: Compile independent Swift6 coordinator and run tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -swift-version 6 -parse-as-library \
            rebuild/Sources/ScarletCleanCore/ScarletActionCoordinator.swift \
            rebuild/Tests/ScarletCleanCoreContract.swift \
            -o "${RUNNER_TEMP}/scarlet-clean-upstream-contract"
          "${RUNNER_TEMP}/scarlet-clean-upstream-contract"

  ios-swiftui:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"
      - name: Typecheck independent SwiftUI under pinned iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc \
            -swift-version 6 -target arm64-apple-ios17.0-simulator \
            -sdk "$sdk" -typecheck \
            rebuild/Sources/ScarletCleanCore/ScarletActionCoordinator.swift \
            rebuild/Sources/ScarletIndependentUI/ScarletIndependentShell.swift
          echo "[PASS] IOS_SWIFTUI_COMPILES_WITH_NEW_PINNED_SOURCES_METADATA"
          echo "[NOTICE] Full native LiveContainer/SideStore/SideSign host is not integrated or installed by this check"
