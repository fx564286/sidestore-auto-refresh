name: Scarlet signing entitlement recovery regression
on:
  push:
    branches:
      - fix/scarlet-entitlement-recovery-20261104
    paths:
      - 'scripts/scarlet_entitlement_recovery.py'
      - 'tests/test_scarlet_entitlement_recovery.py'
      - '.github/workflows/scarlet-entitlement-recovery.yml'
  pull_request:
    paths:
      - 'scripts/scarlet_entitlement_recovery.py'
      - 'tests/test_scarlet_entitlement_recovery.py'
      - '.github/workflows/scarlet-entitlement-recovery.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and all offline regression tests
        run: |
          python3 -m py_compile scripts/scarlet_entitlement_recovery.py
          python3 -m unittest discover -s tests -p 'test_scarlet_entitlement_recovery.py' -v
      - name: Verify no downgrade or external signing capability
        shell: bash
        run: |
          ! grep -qE 'ideviceinstaller|codesign.*--sign|revoke.*[Cc]ert' scripts/scarlet_entitlement_recovery.py
          grep -q 'authorized(ent,rights\[MAIN\])' scripts/scarlet_entitlement_recovery.py
