name: Scarlet Crystal V186 auth-start outcome regression
on:
  push:
    branches: [fix/scarlet-v186-auth-start-outcome-20261104]
    paths:
      - '.github/workflows/scarlet-v186-auth-smoke.yml'
      - 'scripts/patch_v186_auth_start_outcome.py'
      - 'tests/test_v186_auth_start_outcome.py'
      - 'scripts/port_v180_design.py'
  pull_request:
    paths:
      - '.github/workflows/scarlet-v186-auth-smoke.yml'
      - 'scripts/patch_v186_auth_start_outcome.py'
      - 'tests/test_v186_auth_start_outcome.py'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python and regression all relevant auth events
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/patch_v186_auth_start_outcome.py
          python3 -m unittest discover -s tests -p 'test_v184_auth_cancel_outcomes.py' -v
          python3 -m unittest discover -s tests -p 'test_v185_auth_owner_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_v186_auth_start_outcome.py' -v
