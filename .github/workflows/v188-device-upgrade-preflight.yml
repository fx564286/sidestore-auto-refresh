name: Scarlet V188 signed IPA upgrade preflight tests
on:
  push:
    branches:
      - fix/scarlet-v188-native-renewal-guard-20261105
    paths:
      - scripts/scarlet_v188_upgrade_existing_device.py
      - tests/test_v188_device_upgrade.py
      - .github/workflows/v188-device-upgrade-preflight.yml
permissions:
  contents: read
jobs:
  offline-upgrade-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compile and safe Wi-Fi upgrade tests
        run: |
          python3 -m py_compile scripts/scarlet_v188_upgrade_existing_device.py
          python3 -m unittest discover -s tests -p 'test_v188_device_upgrade.py' -v
