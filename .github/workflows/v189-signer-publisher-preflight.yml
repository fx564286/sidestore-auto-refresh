name: Scarlet V189 local signing publisher safety preflight
on:
  push:
    branches:
      - fix/scarlet-v189-update-provenance-auth-20261105
    paths:
      - tools/scarlet_v189_sign_and_publish.py
      - .github/workflows/v189-signer-publisher-preflight.yml
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate local V189 signing and actual-app publication source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/scarlet_v189_sign_and_publish.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/scarlet_v189_sign_and_publish.py').read_text()
          for required in (
              'Scarlet-Crystal-V189-SIGNED-DEVELOPMENT.ipa',
              'Scarlet-Crystal-V189-UPDATE-TRUTH-UNSIGNED',
              '3.8.203','P8EZT3U5N4','SIGNER',
              'CFBundleVersion','ScarletBuildLabel','sha256',
              'gh","run","download','itms-services://',
              'DEVELOPMENT_SIGNED_SAFARI_OTA_NOT_GUARANTEED',
          ):
              assert required in s, required
          for forbidden in ('submitDevelopmentCSR','revokeDevelopmentCert',
                            'deleteAppId','com.apple.webClip.managed'):
              assert forbidden not in s, forbidden
          print('[PASS] V189_REAL_SIGNED_APP_PUBLISHER_PREFLIGHT')
          PY
