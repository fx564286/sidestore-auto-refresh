name: Scarlet iPhone requested local signing agent tests
on:
  push:
    branches:
      - feat/scarlet-universal-shortcut-publisher-20261105
    paths:
      - tools/scarlet_shortcut_sign_agent.py
      - scripts/install_scarlet_shortcut_sign_agent.sh
      - tests/test_scarlet_shortcut_sign_agent.py
      - .github/workflows/scarlet-sign-agent-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate only owner dispatch may initiate local Apple signing
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install_scarlet_shortcut_sign_agent.sh
          python3 -m py_compile tools/scarlet_shortcut_sign_agent.py
          python3 -m unittest discover -s tests -p test_scarlet_shortcut_sign_agent.py -v
          echo '[PASS] IPHONE_DISPATCH_LOCAL_SIGNER_SAFE_CONTRACT'
