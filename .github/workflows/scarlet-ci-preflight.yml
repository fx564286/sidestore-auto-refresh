name: Scarlet Crystal fast CI preflight

on:
  push:
    branches:
      - ci/scarlet-quality-speed-20261028
      - fix/scarlet-v149-package-gate-20261028
      - fix/scarlet-v150-touch-glass-outside-20261028
      - fix/scarlet-v151-polish-geometry-20261028
      - fix/scarlet-v152-universal-geometry-20261028
      - fix/scarlet-v153-three-controls-20261029
      - fix/scarlet-v154-three-runtime-fixes-20261029
      - fix/scarlet-v155-one-liveprocess-20261029
      - fix/scarlet-v155-retired-tabs-ci-20261029
      - fix/scarlet-v156-stable-glass-outside-20261029
      - fix/scarlet-v157-wider-panel-20261029
      - fix/scarlet-v158-tab-size-action-glass-20261029
      - fix/scarlet-v159-fixed-panel-native-actions-20261030
      - fix/scarlet-v160-outside-glass-parity-20261031
      - fix/scarlet-v161-compact-outside-20261031
    paths:
      - '.github/workflows/livecontainer-build.yml'
      - '.github/workflows/scarlet-ci-preflight.yml'
      - 'scripts/scarlet_ci_preflight.py'
      - 'scripts/package_livecontainer_combined.py'
      - 'tests/test_ci_preflight.py'
      - 'tests/test_v149_package_marker_parity.py'
      - 'scripts/patch_v150_touch_glass.py'
      - 'tests/test_v150_touch_glass.py'
      - 'tests/test_v150_package_parity.py'
      - 'scripts/patch_v151_geometry.py'
      - 'scripts/patch_v151_glass_polish.py'
      - 'tests/test_v151_geometry.py'
      - 'tests/test_v151_glass_polish.py'
      - 'tests/test_v151_package_parity.py'
      - 'tests/test_v152_universal_guest_parity.py'
      - 'scripts/patch_v153_three_fixes.py'
      - 'tests/test_v153_three_fixes.py'
      - 'tests/test_v153_package_parity.py'
      - 'scripts/patch_v154_three_runtime_fixes.py'
      - 'tests/test_v154_runtime_three_fixes.py'
      - 'scripts/patch_v155_single_liveprocess.py'
      - 'tests/test_v155_single_liveprocess.py'
      - 'scripts/patch_v156_panel_size_outside.py'
      - 'tests/test_v156_stable_glass.py'
      - 'tests/test_v156_package_parity.py'
      - 'scripts/patch_v157_panel_width.py'
      - 'tests/test_v157_wide_panel.py'
      - 'tests/test_v157_package_parity.py'
      - 'scripts/patch_v158_unified_action_glass.py'
      - 'tests/test_v158_unified_action_glass.py'
      - 'tests/test_v158_package_parity.py'
      - 'scripts/patch_v159_panel_height_native_action.py'
      - 'scripts/patch_v160_outside_visual_parity.py'
      - 'scripts/patch_v161_compact_outside.py'
      - 'tests/test_v159_panel_action_press.py'
      - 'tests/test_v160_outside_visual_parity.py'
      - 'tests/test_v161_compact_outside.py'
      - 'tests/test_v159_package_parity.py'
      - 'tests/test_v160_package_parity.py'
      - 'tests/test_v161_package_parity.py'
      - 'scripts/patch_v58_fullscreen.py'
      - 'tests/test_v58_fullscreen_activity.py'
      - 'tests/test_repository.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scarlet-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate profile definitions and release identity before Xcode
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/scarlet_ci_preflight.py
          python3 -m unittest \
            tests.test_ci_preflight \
            tests.test_repository.RepositoryTests.test_current_files_exist \
            tests.test_v147_from_v144 \
            tests.test_v148_action_glass \
            tests.test_v149_controls \
            tests.test_v149_package_marker_parity \
            tests.test_v150_touch_glass \
            tests.test_v150_package_parity \
            tests.test_v151_geometry \
            tests.test_v151_glass_polish \
            tests.test_v151_package_parity \
            tests.test_v152_universal_guest_parity \
            tests.test_v153_three_fixes \
            tests.test_v153_package_parity \
            tests.test_v154_runtime_three_fixes \
            tests.test_v155_single_liveprocess \
            tests.test_v156_stable_glass \
            tests.test_v156_package_parity \
            tests.test_v157_wide_panel \
            tests.test_v157_package_parity \
            tests.test_v158_unified_action_glass \
            tests.test_v158_package_parity \
            tests.test_v159_panel_action_press \
            tests.test_v159_package_parity \
            tests.test_v160_outside_visual_parity \
            tests.test_v160_package_parity \
            tests.test_v161_compact_outside \
            tests.test_v161_package_parity \
            tests.test_v58_fullscreen_activity -v
          echo '[SCARLET_CI] status=PRECHECK_PASS no_xcode_build_started=1'
