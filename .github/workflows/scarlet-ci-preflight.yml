name: Scarlet Crystal fast CI preflight

on:
  push:
    branches:
      - ci/scarlet-quality-speed-20261028
      - fix/scarlet-v149-package-gate-20261028
      - fix/scarlet-v150-touch-glass-outside-20261028
      - fix/scarlet-v151-polish-geometry-20261028
    paths:
      - '.github/workflows/livecontainer-build.yml'
      - '.github/workflows/scarlet-ci-preflight.yml'
      - 'scripts/scarlet_ci_preflight.py'
      - 'scripts/package_livecontainer_combined.py'
      - 'tests/test_ci_preflight.py'
      - 'tests/test_v149_package_marker_parity.py'
      - 'scripts/patch_v150_touch_glass.py'
      - 'tests/test_v150_touch_glass.py'
      - 'tests/test_v150_package_parity.py'
      - 'scripts/patch_v151_geometry.py'
      - 'scripts/patch_v151_glass_polish.py'
      - 'tests/test_v151_geometry.py'
      - 'tests/test_v151_glass_polish.py'
      - 'tests/test_v151_package_parity.py'
      - 'tests/test_repository.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scarlet-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate profile definitions and release identity before Xcode
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/scarlet_ci_preflight.py
          python3 -m unittest \
            tests.test_ci_preflight \
            tests.test_repository.RepositoryTests.test_current_files_exist \
            tests.test_v147_from_v144 \
            tests.test_v148_action_glass \
            tests.test_v149_controls \
            tests.test_v149_package_marker_parity \
            tests.test_v150_touch_glass \
            tests.test_v150_package_parity \
            tests.test_v151_geometry \
            tests.test_v151_glass_polish \
            tests.test_v151_package_parity -v
          echo '[SCARLET_CI] status=PRECHECK_PASS no_xcode_build_started=1'
