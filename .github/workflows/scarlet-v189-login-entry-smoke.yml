name: Scarlet V189 visible Apple login and inline 2FA source smoke

on:
  push:
    branches:
      - fix/scarlet-v189-update-provenance-auth-20261105
    paths:
      - ".github/workflows/scarlet-v189-login-entry-smoke.yml"
      - "scripts/patch_v189_login_entry.py"
      - "tests/test_v189_login_entry.py"
      - "scripts/patch_v189_auth_bridge_trace.py"
      - "tests/test_v189_auth_bridge_trace.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visible-login-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and V189 password-lifetime regressions
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_v189_login_entry.py tests/test_v189_login_entry.py
          python3 -m unittest discover -s tests -p test_v189_login_entry.py -v
          python3 -m py_compile scripts/patch_v189_auth_bridge_trace.py tests/test_v189_auth_bridge_trace.py
          python3 -m unittest discover -s tests -p test_v189_auth_bridge_trace.py -v
      - name: Ensure IPA release is not claimed by unit tests
        run: |
          test -f scripts/patch_v189_login_entry.py
          echo '[PASS] login UI source tests only; iOS device sign-in and 2FA not yet validated'
