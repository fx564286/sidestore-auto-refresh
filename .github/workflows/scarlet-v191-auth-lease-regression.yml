name: Scarlet V191 fast auth lease regression
on:
  push:
    branches:
      - fix/scarlet-v191-auth-lease-deadline-20261106
    paths:
      - scripts/patch_v191_auth_lease_deadline.py
      - scripts/patch_v191_settings_control_actions.py
      - tests/test_v191_settings_control_actions.py
      - tests/test_v191_auth_lease_deadline.py
      - .github/workflows/scarlet-v191-auth-lease-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lease-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python behavioral contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_v191_auth_lease_deadline.py
          python3 -m unittest discover -s tests -p test_v189_auth_bridge_trace.py -v
          python3 -m unittest discover -s tests -p test_v191_auth_lease_deadline.py -v
          python3 -m unittest discover -s tests -p test_v191_settings_control_actions.py -v
      - name: Check Swift syntax of actual patched pinned host bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import tempfile
          root=Path.cwd()
          def import_file(path,name):
              spec=importlib.util.spec_from_file_location(name,root/path)
              module=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
          v189=import_file(Path("scripts/patch_v189_auth_bridge_trace.py"),"v189")
          v191=import_file(Path("scripts/patch_v191_auth_lease_deadline.py"),"v191")
          before=(root/"scripts/templates/v3_service_bridge.swift").read_text()
          after=v191.patch_bridge(v189.patch_bridge(before))
          temp=Path("/tmp/scarlet-v191-patched-bridge.swift")
          temp.write_text(after)
          print("[PASS] V191_PATCHED_SWIFT_BRIDGE_WRITTEN",len(after))
          PY
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -frontend -parse /tmp/scarlet-v191-patched-bridge.swift
            echo "[PASS] V191_SWIFT_PARSE"
          else
            echo "[SKIP] swiftc unavailable on Linux; integrated macOS Xcode gate remains required"
          fi
