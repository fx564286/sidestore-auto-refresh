name: Scarlet integrated IPA - cached engine public release

on:
  workflow_dispatch:
  push:
    branches: [rebuild/scarlet-from-zero-20261106, fix/scarlet-pr48-guest-overlay-no-resize-20261109, fix/scarlet-pr48-airpods-glass-guest-switch-v3-20261109, fix/scarlet-pr48-draggable-guest-tab-v4-20261109, fix/scarlet-pr48-v5-glass-drag-cert-recovery-20261109, fix/scarlet-pr48-v6-unified-cert-glass-20261109, fix/scarlet-pr48-v7-cert-jitless-unify-panel-rim-20261109, fix/scarlet-pr48-v8-flicker-certificate-menu-20261109]
    paths: [".github/workflows/scarlet-integrated-download-fast.yml"]

permissions:
  contents: write
  actions: read

jobs:
  package-and-publish:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # The latest LiveContainer binary was compiled from the exact new UI
      # SHA. SideStore is pinned unchanged, so reuse the audited binary from
      # the already successful paired build instead of rebuilding it again.
      - uses: actions/download-artifact@v4
        with:
          name: Scarlet-LiveContainer-Native-Engine
          path: artifacts/lc
          run-id: 42596598248
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: Scarlet-SideStore-Native-Engine
          path: artifacts/side
          run-id: 42588970113
          github-token: ${{ github.token }}

      - name: Fail closed unless cached artifacts match reviewed current sources/pins
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          pins=json.loads(Path("config/scarlet-upstream-pins.json").read_text())
          source=json.loads(Path("artifacts/side/source-gitlink-audit.json").read_text())
          assert source["sourcePins"]==pins,"SideStore reusable artifact does not match exact current pins"
          host=json.loads(Path("artifacts/lc/scarlet-host-integration.json").read_text())
          files={Path(x["path"]).name:x["sha256"] for x in host["sources"]}
          for filename in ("ScarletIndependentShell.swift",
                           "ScarletIntegratedHostView.swift",
                           "ScarletFullscreenGuestTab.swift",
                           "ScarletSigningReadinessPanel.swift",
                           "ScarletNativeGlass.swift"):
              path=Path("rebuild/Sources/ScarletIndependentUI" if filename=="ScarletIndependentShell.swift"
                        else "rebuild/HostApp") / filename
              got=hashlib.sha256(path.read_bytes()).hexdigest()
              assert files.get(filename)==got,(filename,"compiled archive source does not match current tree")
          assert Path("artifacts/side/SideStore.ipa").stat().st_size>1_000_000
          assert Path("artifacts/lc/LiveContainer-app.tar").stat().st_size>1_000_000
          print("[PASS] Compiled UI source hashes and pinned reusable SideStore audited")
          PY

      - name: Fetch and verify official packaging prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          brew install ldid
          mkdir -p report build-tools
          # Pinned upstream official release download; exact SHA256 below.
          # API binary Accept route currently returns HTTP 403 on macOS runner.
          # Browser endpoint was independently fetched and SHA256 verified.
          curl -fLSs --retry 5 --retry-all-errors --retry-delay 3 \
            -H "User-Agent: scarlet-ci-pinned-artifact" \
            https://github.com/LiveContainer/dylibify/releases/download/1.0/dylibify \
            -o build-tools/dylibify
          printf '6d23f6a2fc4d8442f87caa1161aebe6ecaafd0e8c41ce205da007efb04fc82c7  build-tools/dylibify\n' | shasum -a 256 -c -
          chmod +x build-tools/dylibify
          pin="$(python3 -c 'import json;print(json.load(open("config/scarlet-upstream-pins.json"))["LIVE_CONTAINER_REF"])')"
          curl -fLSs --retry 3 \
            "https://raw.githubusercontent.com/LiveContainer/LiveContainer/$pin/.github/sidelc/LCAppInfo.plist" \
            -o build-tools/LCAppInfo.plist
          plutil -lint build-tools/LCAppInfo.plist

      - name: Build and verify current integrated IPA
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 rebuild/integration/package_paired.py \
            --lc-tar artifacts/lc/LiveContainer-app.tar \
            --sidestore-ipa artifacts/side/SideStore.ipa \
            --lc-appinfo build-tools/LCAppInfo.plist \
            --dylibify build-tools/dylibify \
            --host-report artifacts/lc/scarlet-host-integration.json \
            --out report
          python3 rebuild/integration/verify_engines.py \
            --phase combined \
            --combined-ipa report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa \
            --report report/combined-ipa-verification.json
          cp report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa Scarlet-PR48-FlickerFix-V8-UNSIGNED.ipa
          shasum -a 256 Scarlet-PR48-FlickerFix-V8-UNSIGNED.ipa > Scarlet-PR48-FlickerFix-V8-UNSIGNED.ipa.sha256

      - name: Publish public permanent GitHub Release download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag=scarlet-pr48-flicker-fix-v8-20261109
          cat > release-notes.md <<'EOF'
          ## Scarlet integrated LiveContainer + SideStore — unsigned IPA

          V8: repeat orientation notifications with unchanged scene dimensions no longer hide the non-key guest overlay. Actual geometry change is debounced until stable. Certificate issuance and SideInstaller-style existing certificate retrieval share one primary SideStore button; manual P12 import and entitlement recheck are collapsed under Advanced. iPhone runtime visual verification remains required. No guest resize, no change to app identity or P12.\n          Existing full-screen guest app geometry, host tabs, runApp() and orientation code UNCHANGED.\n          No forced landscape or simultaneous multi-process claim.\n          Signed installation and real iPhone UI validation still required.
          **UNSIGNED, DIAGNOSTIC ONLY. Not directly installable on iPhone.**
          Native signing, Apple login, app execution and Liquid Glass real-device
          verification remain unconfirmed. Original users' data is unchanged.
          EOF
          printf "\nCompiled new UI: %s\nReused audited pinned SideStore: 42588970113\n" \
            "42596598248" >> release-notes.md
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Scarlet PR48 V8 flicker-free guest tab and unified SideStore certificate UI - unsigned IPA" \
              --prerelease --latest=false --notes-file release-notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            Scarlet-PR48-FlickerFix-V8-UNSIGNED.ipa \
            Scarlet-PR48-FlickerFix-V8-UNSIGNED.ipa.sha256 --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "Scarlet PR48 V8 flicker-free guest tab and unified SideStore certificate UI - unsigned IPA" \
            --prerelease --notes-file release-notes.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fx "Scarlet-PR48-FlickerFix-V8-UNSIGNED.ipa"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Scarlet-PR48-FlickerFix-V8-UNSIGNED.ipa" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out existing GitHub Pages without changing website files
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - name: Publish identical IPA through reliable Safari GitHub Pages URL
        shell: bash
        run: |
          set -Eeuo pipefail
          cp Scarlet-PR48-FlickerFix-V8-UNSIGNED.ipa pages/
          (cd pages && sha256sum Scarlet-PR48-FlickerFix-V8-UNSIGNED.ipa)
          git -C pages config user.name "scarlet-pages-asset-bot"
          git -C pages config user.email "github-actions[bot]@users.noreply.github.com"
          git -C pages add -f -- Scarlet-PR48-FlickerFix-V8-UNSIGNED.ipa
          if ! git -C pages diff --cached --quiet; then
            git -C pages commit -m "downloads: verified Scarlet PR48 V8 blink-fix and certificate menu unsigned IPA"
            git -C pages push origin HEAD:gh-pages
          fi
          echo "https://fx564286.github.io/sidestore-auto-refresh/Scarlet-PR48-FlickerFix-V8-UNSIGNED.ipa" >> "$GITHUB_STEP_SUMMARY"
