name: V188 PEM Signing Compatibility Tests
on:
  push:
    branches:
      - fix/scarlet-v188-native-renewal-guard-20261105
    paths:
      - scripts/scarlet_v188_sign_local.py
      - tests/test_v188_pem_signing.py
      - .github/workflows/v188-pem-signing-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pem-signing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Run OpenSSL PEM identity and rcodesign arguments regression
        run: |
          python3 -m py_compile scripts/scarlet_v188_sign_local.py
          python3 -m unittest discover -s tests -p 'test_v188_pem_signing.py' -v
          echo '[PASS] V188_PEM_SIGNING_REGRESSION_TESTS'
