          python3 - <<'PY'
          import importlib.util
          import subprocess
          from pathlib import Path
          root=Path("work/EmbeddedSideStore")
          relative="SideStore/Core/Anisette/OnDeviceAnisetteManager.swift"
          changed=subprocess.check_output(
              ["git", "-C", str(root), "diff", "--name-only", "--", "SideStore/Core/Anisette"],
