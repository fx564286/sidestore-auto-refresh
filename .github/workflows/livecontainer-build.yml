      - name: Execute real iOS 27.2 simulator layout diagnostic
        # V83: a simulator hang must remain visible, not prevent IPA compilation.
        # IPA build success is not a statement about simulator layout success.
        id: scarlet_layout
        continue-on-error: true
        if: ${{ github.ref_name == 'fix/scarlet-v83-xcode272-simulator-rescue-20261024' }}
        shell: bash
        env:
          SCARLET_LAYOUT_IOS: "27.2"
        run: |
          set -euo pipefail
          git -C builder fetch --no-tags origin 7d8ae12905f8baa6e0ecc4dbdd3f25e2aa0e43fa
          python3 builder/scripts/run_issue25_rendering.py --livecontainer work/LiveContainer \
            --v3-source work/LiveContainer/LiveContainerSwiftUI/Views/V3UnifiedShell.swift \
            --output artifacts/layout-evidence 2>&1 | tee artifacts/logs/layout-rendering.log

      - name: Record simulator verdict independently
        if: ${{ always() && github.ref_name == 'fix/scarlet-v83-xcode272-simulator-rescue-20261024' }}
        shell: bash
        env:
          SCARLET_LAYOUT_OUTCOME: ${{ steps.scarlet_layout.outcome }}
        run: |
          mkdir -p artifacts/logs artifacts/layout-evidence
          if [ "$SCARLET_LAYOUT_OUTCOME" = success ] && python3 -c 'import json; assert json.load(open("artifacts/layout-evidence/rendering-verification.json"))["passed"] is True'; then
            echo 'SCARLET_V83_LAYOUT=PASS actual_iOS27.2_simulator_evidence=present' | tee artifacts/logs/v83-layout-verdict.txt
          else
            echo 'SCARLET_V83_LAYOUT=UNVERIFIED simulator_rendering_did_not_pass' | tee artifacts/logs/v83-layout-verdict.txt
            echo '::warning::Scarlet V83 UI validation was not successful; IPA build is independent.'
          fi

      - name: Preserve independent simulator outcome
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/logs
          if [ -f artifacts/layout-evidence/rendering-verification.json ] && grep -q '"passed": true' artifacts/layout-evidence/rendering-verification.json; then
            echo "simulator_layout=PASS" | tee artifacts/logs/v83-layout-verdict.txt
          else
            echo "simulator_layout=UNVERIFIED" | tee artifacts/logs/v83-layout-verdict.txt
            echo "::warning::Simulation lacked passing iOS 27.2 evidence; only the IPA build may pass."
          fi

      - name: Preserve real layout measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-v3-layout-evidence
          path: |
            artifacts/layout-evidence/**/*.json
            artifacts/layout-evidence/**/*.png
            artifacts/layout-evidence/**/*.log
            artifacts/layout-evidence/**/*.txt
            artifacts/logs/layout-rendering.log
            artifacts/logs/v83-layout-verdict.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Build unified host before transport compilation
        # Intel Xcode runners can stall under excessive Swift frontend workers.
        # Cap jobs, stream directly to disk, terminate the process group on timeout.
        timeout-minutes: 23
        shell: bash
        run: |
          set -euo pipefail
          echo '[NRG_V67] diagnostic preflight'; df -h . "$RUNNER_TEMP"; sysctl -n hw.memsize || true
          python3 builder/scripts/run_bounded_build.py \
            --log artifacts/logs/livecontainer-build.log --timeout-seconds 1200 -- \
            xcodebuild -project work/LiveContainer/LiveContainer.xcodeproj -showBuildTimingSummary -jobs 2 \
            -scheme LiveContainer -sdk iphoneos -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/livecontainer-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO build

      # V78: NUDGuestHooksInit is in LiveContainerShared.framework, not
      # the LiveProcess.appex executable. Never symbolize a different image.
      - name: Record LiveContainerShared NUD disassembly and UUID
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/logs
          {
            echo 'V78 LiveContainerShared.framework linked-image forensic evidence'
            product="$RUNNER_TEMP/livecontainer-derived-data/Build/Products/Release-iphoneos"
            binary="$product/LiveContainer.app/Frameworks/LiveContainerShared.framework/LiveContainerShared"
            if [[ ! -f "$binary" ]]; then
              binary="$(find "$product" -type f -path '*/LiveContainerShared.framework/LiveContainerShared' -print -quit 2>/dev/null || true)"
            fi
            if [[ -z "$binary" || ! -f "$binary" ]]; then
              echo '[UNAVAILABLE] LiveContainerShared image missing: no disassembly/UUID claim'
            else
              echo '[FOUND] LiveContainerShared image (NOT the LiveProcess executable)'
              file "$binary"
              echo '[UUID/ARCH]'
              xcrun dwarfdump --uuid "$binary" || true
              echo '[SYMBOLS] NUDGuestHooksInit'
              xcrun nm -an "$binary" | grep -F 'NUDGuestHooksInit' || true
              echo '[DISASSEMBLY] _NUDGuestHooksInit and instruction bytes'
              xcrun llvm-objdump --macho --dis-symname=_NUDGuestHooksInit "$binary" \
                || xcrun llvm-objdump --disassemble-symbols=_NUDGuestHooksInit "$binary" \
                || echo '[UNAVAILABLE] stripped function; use matching binary/dSYM'
            fi
            echo '[NOTE] The 2026-10-24 original fault address +456 belongs to'
            echo '       the crashed original image UUID, not to this patched V78 image.'
            echo '[NOTE] Do not treat the imageOffset=93456 as an identical V78'
            echo '       instruction location. Match the ORIGINAL image UUID first.'
          } 2>&1 | tee artifacts/logs/v78-liveprocess-forensics.txt

      - name: Preserve first Xcode build diagnostic even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scarlet-v67-first-build-diagnostics
          path: |
            artifacts/logs/livecontainer-build.log
            artifacts/logs/host-preflight.log
            artifacts/logs/v78-liveprocess-forensics.txt
          if-no-files-found: warn
          retention-days: 14

      # Keep one long-lived build branch to reuse Rust artifacts across versions.
      # Exact pinned revisions, patch scripts, Cargo locks and Xcode isolate
      # the cache. The tests and build STILL run on every release.
      - name: Restore pinned Rust transport build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/bindgen
            ~/.cargo/registry
            ~/.cargo/git
            idevice/target
            jktcp/target
          key: rust-ios27.2-${{ runner.os }}-${{ runner.arch }}-bindgen0.72.1-${{ env.IDEVICE_REF }}-${{ env.JKTCP_REF }}-${{ hashFiles('idevice/Cargo.lock', 'jktcp/Cargo.lock', 'builder/scripts/patch_coredevice_idevice.py', 'builder/scripts/patch_jktcp_reliability.py') }}

