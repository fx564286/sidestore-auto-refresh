name: LiveContainer embedded SideStore build

on:
  workflow_dispatch:
  push:
    branches: [fix/combined-refresh-build-and-runtime, fix/v3.0.3-auth-errors, build/nrg-v3-ipa-priority-20261015, fix/nrg-cert-import-20261016, fix/nrg-jitless-cert-recovery-20261016, fix/nrg-jitless-auto-import-v17-20261017, fix/nrg-jitless-selfheal-v18, fix/nrg-cert-usb-bootstrap-v19, fix/nrg-cert-usb-bootstrap-v20, fix/nrg-refresh-correlation-v21, fix/nrg-v22-refresh-team-repair, fix/nrg-v23-direct-lockdown-refresh, fix/nrg-v24-refresh-install-recovery, fix/nrg-v25-rppairing-first-ios27, fix/nrg-v26-install-cancellation-trace, fix/nrg-v27-install-ui-lifecycle, fix/nrg-v28-refresh-regression, fix/nrg-v29-gsa-identity, fix/nrg-v30-auth-code3-rootcause, fix/nrg-v31-adi-45061-reprovision, fix/nrg-v32-jitless-cert-observation, fix/nrg-v33-iram-memory-integration, fix/nrg-v34-memory-display-profiles, fix/nrg-v45-settings-first-20261018, fix/nrg-v46-keyboard-window-scope-20261018, fix/nrg-v47-four-issue-recovery-20261018, fix/nrg-v48-madeira-runtime-20261018, fix/nrg-v49-jit-auto-return-20261019, fix/nrg-v50-stikdebug-pid-script-20261019, fix/nrg-v52-ota-inapp-20261019, fix/nrg-v53-orientation-geometry-20261019, fix/nrg-v54-guest-jit-geometry-20261019, fix/nrg-v55-display-watchdog-memory, fix/nrg-v56-notch-controls-20261019, fix/nrg-v57-ota-self-update-identity-20261019, fix/nrg-v58-native-island-fullscreen-20261019, fix/nrg-v192-scarlet-crashguard, audit/nrg-v199-ci-keychain-20261021, fix/nrg-v214-diagnostics-stikdebug-20261021]

permissions:
  contents: read

concurrency:
  group: livecontainer-${{ github.ref }}
  cancel-in-progress: true

env:
  LIVE_CONTAINER_REF: 12377cf3b91d51739a33f14a302e5f522b238593
  EMBEDDED_SIDESTORE_REF: ff25922e5c13ccfafd83bda5092910d848ebd409
  MINIMUXER_REF: 98c3c79982f813878e922ab42f9545314a700f0c
  SIDESIGN_REF: a731c0d5a9a6617c7b385ae493e07ffb7f81cd5d
  SIDESIGN_GSA_FIX: 35993d7f68950ce00d6bf1fd0fbcaa7bef51dc9c
  IDEVICE_REF: ebd7dadfc55d1c4facee3d11ecf5b28e20548b57
  JKTCP_REF: e674e1eee6d5943e13b1eba0bd24a9dd0b2fa020

jobs:
  source-and-host-build:
    # V58: native arm64 queue starved; standard Intel macOS 26 image also has Xcode 26.4.1.
    # This is a cross-build for iphoneos arm64, not a change of IPA architecture.
    runs-on: macos-26-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false

      - name: Checkout pinned LiveContainer sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          git clone --filter=blob:none https://github.com/LiveContainer/LiveContainer.git work/LiveContainer
          git -C work/LiveContainer checkout --detach "$LIVE_CONTAINER_REF"
          git -C work/LiveContainer submodule update --init --recursive --depth=1

      - name: Checkout pinned embedded SideStore sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/LiveContainer/SideStore.git work/EmbeddedSideStore
          git -C work/EmbeddedSideStore checkout --detach "$EMBEDDED_SIDESTORE_REF"
          git -C work/EmbeddedSideStore submodule update --init --recursive --depth=1

      - name: Checkout pinned idevice
        uses: actions/checkout@v4
        with:
          repository: SideStore/idevice
          ref: ${{ env.IDEVICE_REF }}
          path: idevice
          fetch-depth: 1
          submodules: recursive

      - name: Checkout pinned jktcp
        uses: actions/checkout@v4
        with:
          repository: SideStore/jktcp
          ref: ${{ env.JKTCP_REF }}
          path: jktcp
          fetch-depth: 1

      - name: Verify exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C work/LiveContainer rev-parse HEAD)" = "$LIVE_CONTAINER_REF"
          test "$(git -C work/EmbeddedSideStore rev-parse HEAD)" = "$EMBEDDED_SIDESTORE_REF"
          test "$(git -C work/EmbeddedSideStore/Dependencies/minimuxer rev-parse HEAD)" = "$MINIMUXER_REF"
          test "$(git -C work/EmbeddedSideStore/Dependencies/SideSign rev-parse HEAD)" = "$SIDESIGN_REF"
          # Verify upstream resolution; never independently checkout or override SideSign.
          git -C work/EmbeddedSideStore/Dependencies/SideSign fetch --unshallow origin
          git -C work/EmbeddedSideStore/Dependencies/SideSign merge-base --is-ancestor "$SIDESIGN_GSA_FIX" HEAD
          printf 'sidestore=%s\nminimuxer=%s\nsidesign=%s\ngsa_fix_ancestor=%s\n' \
            "$EMBEDDED_SIDESTORE_REF" "$MINIMUXER_REF" "$SIDESIGN_REF" "$SIDESIGN_GSA_FIX" \
            | tee artifacts/logs/upstream-auth-provenance.txt
          test "$(git -C idevice rev-parse HEAD)" = "$IDEVICE_REF"
          test "$(git -C jktcp rev-parse HEAD)" = "$JKTCP_REF"

      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Run repository checks before patches
        env:
          LIVE_CONTAINER_TEST_SOURCE: ${{ github.workspace }}/work/LiveContainer
          SIDESTORE_TEST_SOURCE: ${{ github.workspace }}/work/EmbeddedSideStore
          EMBEDDED_SIDESTORE_TEST_SOURCE: ${{ github.workspace }}/work/EmbeddedSideStore
          SIDESIGN_TEST_SOURCE: ${{ github.workspace }}/work/EmbeddedSideStore/Dependencies/SideSign
          SIDESTORE_070_TEST_SOURCE: ${{ github.workspace }}/work/EmbeddedSideStore
          REQUIRE_SWIFT_070_CHECKS: "1"
          REQUIRE_PINNED_SOURCE_CLASSIFIER_TEST: "1"
        shell: bash
        run: |
          set -euo pipefail
          # V199: enforce the full repository regression suite, including new tests.
          # The test runner rejects unexpected skips and missing source coverage.
          # Pinned sources and Xcode have already been prepared above.
          python3 builder/scripts/run_required_tests.py \
            --start-directory builder/tests \
            --top-level-directory builder/tests \
            --pattern 'test_*.py' \
            --allowlist builder/scripts/required_test_skip_allowlist.json \
            --verbosity 2 2>&1 | tee artifacts/logs/repository-tests.log

      # Fail on generated Swift/configuration errors BEFORE compiling Rust/iOS.
      - name: Apply and verify host integration
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 builder/scripts/patch_livecontainer_autorefresh.py work/LiveContainer
            python3 builder/scripts/patch_livecontainer_autorefresh.py work/LiveContainer
            python3 builder/scripts/patch_embedded_sidestore_startup.py work/LiveContainer work/EmbeddedSideStore
            python3 builder/scripts/patch_embedded_sidestore_startup.py work/LiveContainer work/EmbeddedSideStore
            python3 builder/scripts/patch_guest_return.py work/LiveContainer
            python3 builder/scripts/patch_guest_return.py work/LiveContainer
            python3 builder/scripts/patch_dead10cc_fix.py work/LiveContainer
            python3 builder/scripts/patch_dead10cc_fix.py work/LiveContainer
            python3 builder/scripts/patch_multitask_dock.py work/LiveContainer
            python3 builder/scripts/patch_multitask_dock.py work/LiveContainer
            # V27: end prior guest keyboard editing and avoid scaled frame persistence.
            python3 builder/scripts/patch_v27_guest_switch.py work/LiveContainer
            python3 builder/scripts/patch_v27_guest_switch.py work/LiveContainer
            # V28: actual remote scene keyboard + audio background lifecycle, PiP exempt.
            python3 builder/scripts/patch_v28_guest_lifecycle.py work/LiveContainer
            python3 builder/scripts/patch_v28_guest_lifecycle.py work/LiveContainer
            # V46: correct owning UIWindow, no global keyboard responder resign.
            python3 builder/scripts/patch_v46_keyboard_window_scope.py work/LiveContainer
            python3 builder/scripts/patch_v46_keyboard_window_scope.py work/LiveContainer
            swiftc -frontend -parse work/LiveContainer/MultitaskSupport/MultitaskDockView.swift
            V46_PATCHED_LIVECONTAINER=work/LiveContainer python3 -m unittest discover -s builder/tests -p test_v46_keyboard_window_scope.py -v
            # V47: restore visible retained guest scenes after iOS host activation.
            python3 builder/scripts/patch_v47_resume.py work/LiveContainer
            python3 builder/scripts/patch_v47_resume.py work/LiveContainer
            swiftc -frontend -parse work/LiveContainer/MultitaskSupport/MultitaskDockView.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/App/AppDelegate.swift
            # V28: querying PiP does not activate the host playback audio session.
            python3 builder/scripts/patch_v28_pip_audio.py work/LiveContainer
            python3 builder/scripts/patch_v28_pip_audio.py work/LiveContainer
            python3 builder/scripts/patch_app_layout.py --v3-grid work/LiveContainer
            python3 builder/scripts/patch_app_layout.py --v3-grid work/LiveContainer
            # V57: fix OTA self identity and UI build labels before source generation.
            python3 builder/scripts/patch_v57_ota_identity.py builder
            python3 builder/scripts/patch_v57_ota_identity.py builder
            python3 builder/scripts/patch_v3_unified_shell.py work/LiveContainer work/EmbeddedSideStore
            python3 builder/scripts/patch_v3_unified_shell.py work/LiveContainer work/EmbeddedSideStore
            python3 builder/scripts/patch_lc_certificate_observation.py work/LiveContainer
            python3 builder/scripts/patch_lc_certificate_observation.py work/LiveContainer
            # V32: independently expose offline signed certificate facts and OCSP status.
            python3 builder/scripts/patch_v32_jitless_diagnosis.py work/LiveContainer
            python3 builder/scripts/patch_v32_jitless_diagnosis.py work/LiveContainer
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
            python3 builder/scripts/patch_v3_service.py work/LiveContainer work/EmbeddedSideStore
            python3 builder/scripts/patch_v3_service.py work/LiveContainer work/EmbeddedSideStore
            # V24: recover transient URLSession -999 on source IPA installs
            # but preserve actual user and parent-operation cancellation.
            python3 builder/scripts/patch_v24_install_download.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v24_install_download.py work/EmbeddedSideStore
            # V26: trace actual native step and cancellation origin, do not bypass user cancellation.
            python3 builder/scripts/patch_v26_install_trace.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v26_install_trace.py work/EmbeddedSideStore
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/StandaloneOperations/DownloadAppOperation.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/PipelineExecutor.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/PipelineRunner.swift
            python3 builder/scripts/patch_v34_display_profiles.py work/LiveContainer
            python3 builder/scripts/patch_v34_display_profiles.py work/LiveContainer
            python3 builder/scripts/patch_v36_multitask_chrome.py work/LiveContainer
            python3 builder/scripts/patch_v36_multitask_chrome.py work/LiveContainer
            python3 builder/scripts/patch_v37_window_overflow.py work/LiveContainer
            python3 builder/scripts/patch_v37_window_overflow.py work/LiveContainer
            python3 builder/scripts/patch_v38_maximized_safe_area.py work/LiveContainer
            python3 builder/scripts/patch_v38_maximized_safe_area.py work/LiveContainer
            python3 builder/scripts/patch_v39_dock_app_switch_only.py work/LiveContainer
            python3 builder/scripts/patch_v39_dock_app_switch_only.py work/LiveContainer
            python3 builder/scripts/patch_v41_remove_floating_return.py work/LiveContainer
            python3 builder/scripts/patch_v41_remove_floating_return.py work/LiveContainer
            # V46 Madeira JIT: return to launchable host app, not LiveProcess.appex.
            python3 builder/scripts/patch_v46_jit_host_bundle.py work/LiveContainer
            python3 builder/scripts/patch_v46_jit_host_bundle.py work/LiveContainer
            grep -Fq 'NRG_V46_JIT_HOST_BUNDLE_RETURN' work/LiveContainer/LiveContainer/LCBootstrap.m
            # V48: log actual host/LiveProcess JIT attach and signed memory grant.
            python3 builder/scripts/patch_v48_madeira_runtime_probe.py work/LiveContainer
            python3 builder/scripts/patch_v48_madeira_runtime_probe.py work/LiveContainer
            # V49: verify the host before automatic JIT-sheet return; keep LiveProcess PID intact.
            python3 builder/scripts/patch_v49_auto_jit.py work/LiveContainer
            python3 builder/scripts/patch_v49_auto_jit.py work/LiveContainer
            # V50: current host/liveprocess PID, correct StikDebug scheme and base64 JS.
            python3 builder/scripts/patch_v50_stikdebug_protocol.py work/LiveContainer
            python3 builder/scripts/patch_v50_stikdebug_protocol.py work/LiveContainer
            # V55: fix fullscreen guest rotation without resizing windowed guests.
            python3 builder/scripts/patch_v55_rotation_geometry.py work/LiveContainer
            python3 builder/scripts/patch_v55_rotation_geometry.py work/LiveContainer
            # V55: log observed physical memory usage; do not claim entitlement grants.
            python3 builder/scripts/patch_v55_memory_probe.py work/LiveContainer
            python3 builder/scripts/patch_v55_memory_probe.py work/LiveContainer
            # V56: no-extra-App-ID notch-adjacent guest controls; preserve host and 3 extensions.
            python3 builder/scripts/patch_v56_notch_ui.py work/LiveContainer
            python3 builder/scripts/patch_v56_notch_ui.py work/LiveContainer
            # V58: iPhone full-window guest viewport, portrait and landscape.
            python3 builder/scripts/patch_v58_fullscreen.py work/LiveContainer
            python3 builder/scripts/patch_v58_fullscreen.py work/LiveContainer
            # V58: genuine system Dynamic Island; one reused LiveWidget bundle ID.
            python3 builder/scripts/patch_v58_native_activity.py work/LiveContainer work/EmbeddedSideStore
            python3 builder/scripts/patch_v58_native_activity.py work/LiveContainer work/EmbeddedSideStore
            # V60: actual installed-guest shortcuts in the genuine Dynamic Island.
            python3 builder/scripts/patch_v60_island_guest_switch.py work/LiveContainer
            python3 builder/scripts/patch_v60_island_guest_switch.py work/LiveContainer
            # V192: iOS 27 startup crash regression and app display branding.
            python3 builder/scripts/patch_v192_startup.py work/LiveContainer
            python3 builder/scripts/patch_v192_startup.py work/LiveContainer
            python3 -m unittest discover -s builder/tests -p test_v60_island_guest_switch.py -v
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/V3UnifiedShell.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
            swiftc -frontend -parse work/EmbeddedSideStore/AltWidget/AltWidgetBundle.swift
            LIVE_CONTAINER_TEST_SOURCE=work/LiveContainer python3 -m unittest discover -s builder/tests -p test_v58_fullscreen_activity.py -v
            swiftc -frontend -parse work/LiveContainer/MultitaskSupport/MultitaskDockView.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/App/AppDelegate.swift
            clang -fsyntax-only -x objective-c -fobjc-arc -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios15.0 work/LiveContainer/MultitaskSupport/DecoratedAppSceneViewController.m 2>/tmp/v55-objc-parse.log || {
              # ObjC is validated in the subsequent Xcode target build; this
              # standalone check may lack the project's private header paths.
              echo "[V55] standalone ObjC syntax check deferred to Xcode"
            }
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Utilities/LCUtilsExtensions.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/AppList/LCAppListView.swift
            swiftc -frontend -parse work/LiveContainer/MultitaskSupport/MultitaskAppWindow.swift
            swiftc -frontend -parse work/LiveContainer/MultitaskSupport/MultitaskDockView.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Models/AppLayoutStyle.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/AppList/LCGridAppCell.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/V3UnifiedShell.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
            python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("background_patch", "builder/scripts/patch_background_automation.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.patch_background_operation(Path("work/EmbeddedSideStore"))
          module.patch_console_log(Path("work/EmbeddedSideStore"))
          PY
            python3 builder/scripts/patch_combined_refresh_contract.py work/EmbeddedSideStore
            python3 builder/scripts/patch_combined_refresh_contract.py work/EmbeddedSideStore
            # The shared-Keychain contract completes SignInOperation here.
            # Verify both pinned transforms before combined startup appends
            # its separate backend overlay to SideStore's AppDelegate.
            python3 builder/scripts/patch_v3_service.py --verify-headless-ui-adapters \
              work/EmbeddedSideStore "$EMBEDDED_SIDESTORE_REF"
            python3 builder/scripts/patch_v3_service.py --verify-sign-in-operation \
              work/EmbeddedSideStore "$EMBEDDED_SIDESTORE_REF"
            python3 builder/scripts/patch_combined_service_startup.py work/LiveContainer work/EmbeddedSideStore v3
            python3 builder/scripts/patch_combined_service_startup.py work/LiveContainer work/EmbeddedSideStore v3
            # V27: exact parent/extension IDs plus free Apple team quota preflight.
            python3 builder/scripts/patch_v27_provisioning.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v27_provisioning.py work/EmbeddedSideStore
            # V28: restore existing-app refresh behavior from V26; V27 new installs retain capacity guards.
            python3 builder/scripts/patch_v28_refresh_regression.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v28_refresh_regression.py work/EmbeddedSideStore
            # V47: cached free-team App ID counts are not Apple server capacity.
            python3 builder/scripts/patch_v47_portal_budget.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v47_portal_budget.py work/EmbeddedSideStore
            # V33: automatic memory capability request for guest app IDs.
            python3 builder/scripts/patch_v33_sidestore_memory.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v33_sidestore_memory.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v43_sidejit_dns_guard.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v43_sidejit_dns_guard.py work/EmbeddedSideStore
            # V45: respect the app's optional server switch and show missing server honestly.
            python3 builder/scripts/patch_v45_builtin_settings.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v45_builtin_settings.py work/EmbeddedSideStore
            # V46 JIT: missing external helper -> paired debugger fallback; verify HTTP response.
            python3 builder/scripts/patch_v46_jit_recovery.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v46_jit_recovery.py work/EmbeddedSideStore
            # V47: transient 502/503/504 proxy errors -> already-paired debugger.
            python3 builder/scripts/patch_v47_jit_transport.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v47_jit_transport.py work/EmbeddedSideStore
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/JIT/SideJITManager.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/StandaloneOperations/EnableJITOperation.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/AppBootManager.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Views/Settings/Advanced/JIT/SideJITServerConfigView.swift
            # V31: ADIOTPRequest -45061: re-provision with old Keychain blob preserved.
            python3 builder/scripts/patch_v31_adi_45061.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v31_adi_45061.py work/EmbeddedSideStore
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Anisette/OnDeviceAnisetteManager.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/PipelineOperations/FetchProvisioningProfilesOperation.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/App/AppDelegate.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/App/LiveContainerAutoRefreshAlarm.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/Settings/LCEmbeddedSideStoreRefreshView.swift
            swiftc -frontend -parse work/LiveContainer/SideStoreSupport/SideStore.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/StandaloneOperations/BackgroundRefreshAppsOperation.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/PipelineOperations/UninstallAppOperation.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Utils/iostreams/ConsoleLog.swift
            swiftc -frontend -parse work/EmbeddedSideStore/AltStore/AppDelegate.swift
            swiftc -frontend -parse work/EmbeddedSideStore/AltStore/Core/Model/DatabaseManager/DatabaseManager.swift
            plutil -lint work/LiveContainer/LiveContainer/Info.plist
            plutil -extract BGTaskSchedulerPermittedIdentifiers.0 raw work/LiveContainer/LiveContainer/Info.plist
            grep -Fq 'LIVE_REFRESH_LOG_RETENTION_V1' work/EmbeddedSideStore/SideStore/Utils/iostreams/ConsoleLog.swift
          } 2>&1 | tee artifacts/logs/host-preflight.log

      - name: Execute real layout regression on final generated source
        if: ${{ false }} # Priority binary build; full V3 workflow covers rendering
        shell: bash
        run: |
          set -euo pipefail
          git -C builder fetch --no-tags origin 7d8ae12905f8baa6e0ecc4dbdd3f25e2aa0e43fa
          python3 builder/scripts/run_issue25_rendering.py --livecontainer work/LiveContainer \
            --v3-source work/LiveContainer/LiveContainerSwiftUI/Views/V3UnifiedShell.swift \
            --output artifacts/layout-evidence 2>&1 | tee artifacts/logs/layout-rendering.log

      - name: Preserve real layout measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-v3-layout-evidence
          path: |
            artifacts/layout-evidence/**/*.json
            artifacts/layout-evidence/**/*.png
          if-no-files-found: warn
          retention-days: 90

      - name: Build unified host before transport compilation
        # Previously 3-6 minutes on both successful and failed macOS 26 Intel builds.
        # Prevent a stalled SwiftPM/xcodebuild from consuming the 60-minute job budget.
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project work/LiveContainer/LiveContainer.xcodeproj \
            -scheme LiveContainer -sdk iphoneos -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/livecontainer-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee artifacts/logs/livecontainer-build.log

      - name: Install build tools
        run: |
          set -euo pipefail
          if ! command -v ldid >/dev/null 2>&1; then HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid; fi
          if ! command -v bindgen >/dev/null 2>&1; then cargo install --locked bindgen-cli --version 0.72.1; fi
          rustup target add aarch64-apple-ios

      - name: Execute canonical LiveContainer certificate observation regression
        env:
          LIVE_CONTAINER_TEST_SOURCE: ${{ github.workspace }}/work/LiveContainer
          REQUIRE_LC_CERTIFICATE_NATIVE_TESTS: "1"
        shell: bash
        run: |
          set -euo pipefail
          brew install openssl@3
          python3 -m unittest discover -s builder/tests -p test_lc_certificate_observation.py -v

      - name: Apply focused CoreDevice transport patches
        run: |
          set -euo pipefail
          python3 builder/scripts/patch_jktcp_reliability.py jktcp
          python3 builder/scripts/patch_coredevice_idevice.py idevice jktcp
          ! grep -R -E 'rppairing_connect_quic|create_quic_listener|quinn::' \
            idevice/ffi/src/tunnel_provider.rs idevice/idevice/src/tunnel.rs
          grep -Fq 'packet.extend_from_slice(CDTUNNEL_MAGIC)' idevice/idevice/src/tunnel.rs
          grep -Fq 'effective_mss = negotiated_mtu.saturating_sub(60).min(1340)' idevice/ffi/src/tunnel_provider.rs
          grep -Fq 'HeartbeatClient::connect' idevice/ffi/src/tunnel_provider.rs
          grep -Fq 'run_sync_local(async move { fd.write_entire(data_slice).await })' idevice/ffi/src/afc.rs
          grep -Fq 'let data = unsafe { Box::from_raw(slice) };' idevice/ffi/src/lib.rs

      - name: Test patched transport sources
        run: |
          set -euo pipefail
          cargo fmt --manifest-path jktcp/Cargo.toml
          cargo fmt --manifest-path idevice/ffi/Cargo.toml
          git -C jktcp diff --check
          git -C idevice diff --check
          cargo test --manifest-path jktcp/Cargo.toml --lib -- --skip tests::local_tcp --skip tests::handle_speed
          cargo check --manifest-path idevice/ffi/Cargo.toml --features obfuscate

      - name: Build idevice for iOS
        working-directory: idevice
        run: |
          set -euo pipefail
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            cargo build --release --target aarch64-apple-ios --features obfuscate --manifest-path ffi/Cargo.toml
          test -f target/aarch64-apple-ios/release/libidevice_ffi.a
          test -f ffi/idevice.h
          grep -Fq 'tunnel_create_usb' ffi/idevice.h
          grep -Fq 'tunnel_heartbeat_is_active' ffi/idevice.h
          grep -Fq 'idevice_set_transport_log_callback' ffi/idevice.h
          xcrun nm -arch arm64 -g target/aarch64-apple-ios/release/libidevice_ffi.a \
            >/tmp/current-idevice-symbols.txt 2>/tmp/current-nm-reader-warnings.txt || true
          grep -E '[[:space:]][Tt][[:space:]]_lockdown_diag_rust_log$' /tmp/current-idevice-symbols.txt
          grep -E '[[:space:]][Tt][[:space:]]_idevice_set_transport_log_callback$' /tmp/current-idevice-symbols.txt
          rm -rf swift/IDevice.xcframework
          cp ffi/idevice.h swift/include/idevice.h
          xcodebuild -create-xcframework -library target/aarch64-apple-ios/release/libidevice_ffi.a \
            -headers swift/include -output swift/IDevice.xcframework

      - name: Patch combined transport and inject local idevice
        shell: bash
        run: |
          set -euo pipefail
          MUX=work/EmbeddedSideStore/Dependencies/minimuxer
          mkdir -p "$MUX/DeviceGateway/LocalBinary"
          rm -rf "$MUX/DeviceGateway/LocalBinary/IDevice.xcframework"
          cp -R idevice/swift/IDevice.xcframework "$MUX/DeviceGateway/LocalBinary/IDevice.xcframework"
          python3 builder/scripts/patch_combined_transport.py "$MUX"
          python3 builder/scripts/patch_local_idevice_package.py "$MUX"
          git -C "$MUX" diff --binary >"$RUNNER_TEMP/combined-transport-first.diff"
          python3 -c 'import hashlib, pathlib, sys; root = pathlib.Path(sys.argv[1]); print([(str(p.relative_to(root)), hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(root.rglob("*.swift"))])' "$MUX" >"$RUNNER_TEMP/combined-swift-first.txt"
          python3 builder/scripts/patch_combined_transport.py "$MUX"
          python3 builder/scripts/patch_local_idevice_package.py "$MUX"
          git -C "$MUX" diff --binary >"$RUNNER_TEMP/combined-transport-second.diff"
          python3 -c 'import hashlib, pathlib, sys; root = pathlib.Path(sys.argv[1]); print([(str(p.relative_to(root)), hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(root.rglob("*.swift"))])' "$MUX" >"$RUNNER_TEMP/combined-swift-second.txt"
          cmp "$RUNNER_TEMP/combined-transport-first.diff" "$RUNNER_TEMP/combined-transport-second.diff"
          cmp "$RUNNER_TEMP/combined-swift-first.txt" "$RUNNER_TEMP/combined-swift-second.txt"
          python3 builder/scripts/patch_combined_service_startup.py --transport "$MUX"
          python3 builder/scripts/patch_combined_service_startup.py --transport "$MUX"
          git -C "$MUX" diff --check
          while IFS= read -r -d '' source; do swiftc -frontend -parse "$source"; done < <(find "$MUX" -type f -name '*.swift' -not -path '*/.build/*' -print0)
          swift package --package-path "$MUX/DeviceGateway" dump-package >"$RUNNER_TEMP/combined-gateway-package.json"
          # V31 exception: one precisely audited ADI recovery transform is
          # allowed. All other Anisette and SideSign sources stay unchanged.
          # Fail if any unexpected source file changes, or if the exact modified
          # file differs from patch(pinned HEAD). Never waive source integrity.
          python3 - <<'PY'
          import importlib.util
          import subprocess
          from pathlib import Path
          root=Path("work/EmbeddedSideStore")
          relative="SideStore/Core/Anisette/OnDeviceAnisetteManager.swift"
          changed=subprocess.check_output(
              ["git", "-C", str(root), "diff", "--name-only", "--", "SideStore/Core/Anisette"],
              text=True).splitlines()
          assert changed == [relative], f"Unexpected Anisette source changes: {changed!r}"
          spec=importlib.util.spec_from_file_location("adi_patch", "builder/scripts/patch_v31_adi_45061.py")
          patch=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(patch)
          original=subprocess.check_output(
              ["git", "-C", str(root), "show", "HEAD:"+relative], text=True)
          actual=(root/relative).read_text(encoding="utf-8")
          assert actual == patch.patch(original), "V31 Anisette transform differs from pinned expected output"
          print("[PASS] V31 only the exact audited ADI recovery changes pinned Anisette sources")
          PY
          # Core Auth/AppManager headless changes are still checked against
          # their exact pinned transforms.
          expected_auth=$(printf '%s\n' \
            'AltStore/Managing Apps/AppManager.swift' \
            'SideStore/Core/Auth/AuthManager.swift' \
            'SideStore/Core/Auth/DeveloperPortalProxy.swift' | sort)
          actual_auth=$(git -C work/EmbeddedSideStore diff --name-only -- \
            'AltStore/Managing Apps/AppManager.swift' SideStore/Core/Auth | sort)
          test "$actual_auth" = "$expected_auth"
          SIDESIGN=work/EmbeddedSideStore/Dependencies/SideSign
          SIDESTORE=work/EmbeddedSideStore
          python3 builder/scripts/patch_sidesign_privacy.py "$SIDESIGN" "$SIDESTORE"
          python3 builder/scripts/patch_sidesign_privacy.py "$SIDESIGN" "$SIDESTORE"
          # V33: audited free-team Increased Memory Limit capability via Apple v1 API.
          python3 builder/scripts/patch_v33_sidesign_memory.py "$SIDESIGN"
          python3 builder/scripts/patch_v33_sidesign_memory.py "$SIDESIGN"
          python3 builder/scripts/patch_sidesign_2fa_state.py "$SIDESIGN"
          python3 builder/scripts/patch_sidesign_2fa_state.py "$SIDESIGN"
          python3 builder/scripts/patch_combined_service_startup.py --portal "$SIDESIGN"
          python3 builder/scripts/patch_combined_service_startup.py --portal "$SIDESIGN"
          # NRG_GSA_RECOVERY_V1: compile the independently patched auth paths.
          python3 builder/scripts/patch_nrg_gsa_auth.py "$SIDESTORE" --sidesign "$SIDESIGN"
          python3 builder/scripts/patch_nrg_gsa_auth.py "$SIDESTORE" --sidesign "$SIDESIGN" --check
          # NRG_GSA_HTTP_STATUS_V2: source-only reviewed overlay
          python3 builder/scripts/patch_nrg_gsa_http_v2.py "$SIDESIGN" --apply
          python3 builder/scripts/patch_nrg_gsa_http_v2.py "$SIDESIGN" --check
          # NRG_GSA_CLIENT_IDENTITY_V3: preserve the advertised SRP client through 2FA
          python3 builder/scripts/patch_nrg_gsa_client_v3.py "$SIDESIGN" --apply
          python3 builder/scripts/patch_nrg_gsa_client_v3.py "$SIDESIGN" --check
          swiftc -frontend -parse "$SIDESIGN/Sources/DeveloperPortal/Authentication.swift"
          swiftc -frontend -parse "$SIDESIGN/Sources/DeveloperPortal/Authentication.swift"
          swiftc -frontend -parse "$SIDESIGN/Sources/DeveloperPortal/DeveloperPortalAPI.swift"
          swiftc -frontend -parse "$SIDESTORE/SideStore/Core/Operations/StandaloneOperations/SignInOperation.swift"
          git -C "$SIDESIGN" diff --check
          expected_sidesign=$(printf '%s\n' \
            'Sources/DeveloperPortal/Authentication.swift' \
            'Sources/DeveloperPortal/AppIDs.swift' \
            'Sources/DeveloperPortal/DeveloperPortalAPI.swift' \
            'Sources/Models/Feature.swift' \
            'Sources/Logging.swift' | sort)
          actual_sidesign=$(git -C "$SIDESIGN" diff --name-only | sort)
          test "$actual_sidesign" = "$expected_sidesign"
          git -C "$SIDESTORE" diff --check
          expected_side_logging=$(printf '%s\n' \
            'SideStore/Core/Logging/OperationLogging.swift' \
            'SideStore/Core/Logging/SideStoreLogging.swift' | sort)
          actual_side_logging=$(git -C "$SIDESTORE" diff --name-only -- SideStore/Core/Logging | sort)
          test "$actual_side_logging" = "$expected_side_logging"

      - name: Build host and embedded SideStore source targets
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/*/SourcePackages/artifacts/openssl
          artifact="$HOME/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          resolved=0
          for attempt in 1 2 3; do
            rm -rf "$artifact"
            rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/*/SourcePackages/artifacts/openssl 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/embedded-sidestore-derived-data/SourcePackages/artifacts/openssl"
            if xcodebuild -resolvePackageDependencies -disablePackageRepositoryCache \
                -project work/EmbeddedSideStore/AltStore.xcodeproj -scheme SideStore \
                -derivedDataPath "$RUNNER_TEMP/embedded-sidestore-derived-data"; then resolved=1; break; fi
            sleep 2
          done
          test "$resolved" -eq 1
          xcodebuild -project work/EmbeddedSideStore/AltStore.xcodeproj \
            -scheme SideStore -sdk iphoneos -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/embedded-sidestore-derived-data" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee artifacts/logs/embedded-sidestore-build.log

      - name: Package and verify combined LiveContainer plus SideStore
        env:
          NRG_V58_NATIVE_ISLAND: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/combined_build_evidence.py identity --product v3.0.3-rc \
            "$RUNNER_TEMP/livecontainer-derived-data/Build/Products/Release-iphoneos/LiveContainer.app" \
            "$RUNNER_TEMP/embedded-sidestore-derived-data/Build/Products/Release-iphoneos/SideStore.app"
          # NRG_V52_OTA_RELEASE: stamp workflow version into packaged unsigned host.
          python3 - <<'PY_NRG_V52'
          from pathlib import Path
          import os,plistlib
          path=Path(os.environ['RUNNER_TEMP'])/'livecontainer-derived-data/Build/Products/Release-iphoneos/LiveContainer.app/Info.plist'
          info=plistlib.loads(path.read_bytes())
          info['NRGOTASequence']=int(os.environ['GITHUB_RUN_NUMBER'])
          # Ensure brand survives Xcode's INFOPLIST_KEY_ build setting overrides.
          info['CFBundleDisplayName']='Scarlet & Crystal'
          info['CFBundleName']='Scarlet & Crystal'
          info['CFBundleVersion']='3.8.192'
          # NRG_STIKDEBUG_QUERY_SCHEMES: canOpenURL() must be declared by the
          # installed host, even when StikDebug is launched for a guest process.
          schemes=info.get('LSApplicationQueriesSchemes', [])
          if not isinstance(schemes, list) or any(not isinstance(s, str) for s in schemes):
              raise RuntimeError('Unexpected LSApplicationQueriesSchemes in host Info.plist')
          for scheme in ('stikdebug', 'stikjit'):
              if scheme not in schemes:
                  schemes.append(scheme)
          info['LSApplicationQueriesSchemes']=schemes
          path.write_bytes(plistlib.dumps(info))
          PY_NRG_V52
          python3 builder/scripts/package_livecontainer_combined.py \
            --root work/LiveContainer \
            --host "$RUNNER_TEMP/livecontainer-derived-data/Build/Products/Release-iphoneos/LiveContainer.app" \
            --side "$RUNNER_TEMP/embedded-sidestore-derived-data/Build/Products/Release-iphoneos/SideStore.app" \
            --output artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa 2>&1 | tee artifacts/logs/combined-packaging.log
          # NRG_V58_NATIVE_ISLAND: exactly one additional WidgetKit extension,
          # keeping all three guest, Share and Launcher extensions intact.
          python3 - <<'PY_WIDGET'
          from pathlib import Path
          import plistlib, zipfile
          ipa = Path('artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa')
          with zipfile.ZipFile(ipa) as archive:
              names=archive.namelist()
              assert not any('/AltWidgetExtension.appex/' in n for n in names)
              prefix='Payload/LiveContainer.app/'
              main=plistlib.loads(archive.read(prefix+'Info.plist'))
              assert main.get('NSSupportsLiveActivities') is True
              assert main.get('CFBundleDisplayName')=='Scarlet & Crystal'
              assert main.get('CFBundleVersion')=='3.8.192'
              query_schemes=main.get('LSApplicationQueriesSchemes', [])
              assert set(('stikdebug', 'stikjit')).issubset(query_schemes)
              assert len(query_schemes)==len(set(query_schemes)), 'duplicate URL schemes'
              found={plistlib.loads(archive.read(n))['CFBundleIdentifier'] for n in names
                     if n.startswith(prefix+'PlugIns/') and n.endswith('.appex/Info.plist')}
              expected={'com.kdt.livecontainer.'+x for x in
                        ('LiveProcess','ShareExtension','LaunchAppExtension','LiveWidget')}
              assert found==expected,(found,expected)
              widget='Payload/LiveContainer.app/PlugIns/LiveWidgetExtension.appex/'
              info=plistlib.loads(archive.read(widget+'Info.plist'))
              assert info['NSExtension']['NSExtensionPointIdentifier']=='com.apple.widgetkit-extension'
              assert archive.read(widget+'LiveWidgetExtension')[:4]==b'\xcf\xfa\xed\xfe'
              print('[PASS] NRG_V58_NATIVE_ISLAND: 5 total IDs, widget and ActivityKit host valid')
          PY_WIDGET
          python3 builder/scripts/patch_combined_refresh_contract.py --verify-ipa artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa \
            2>&1 | tee artifacts/logs/runtime-contract-verification.log
          printf 'builder_commit=%s\n' "$GITHUB_SHA" > artifacts/builder-commit.txt
          python3 builder/scripts/combined_build_evidence.py collect --product v3.0.3-rc \
            --ipa artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa --output artifacts/debug-evidence --source work/LiveContainer --side-source work/EmbeddedSideStore \
            "$RUNNER_TEMP/livecontainer-derived-data/Build/Products/Release-iphoneos" \
            "$RUNNER_TEMP/embedded-sidestore-derived-data/Build/Products/Release-iphoneos"
          python3 builder/scripts/verify_candidate_ipa.py \
            --ipa artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa \
            --provenance artifacts/debug-evidence/candidate-provenance.json \
            --product v3.0.3-rc \
            --side-source work/EmbeddedSideStore \
            --builder-commit "$GITHUB_SHA" \
            --build-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output artifacts/candidate-package-verification.json

      - name: Verify embedded CoreDevice transport executable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          ipa = Path('artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa')
          embedded = 'Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/SideStore'
          with zipfile.ZipFile(ipa) as archive:
              executable = archive.read(embedded)
          assert executable[:4] == b'\xcf\xfa\xed\xfe', 'Expected embedded arm64 Mach-O'
          assert b'no ipsec interface (required for lockdown on iOS 26.4+)' not in executable, 'Obsolete IPSec guard remains'
          markers = ('[SIDESTORE_COREDEVICE] PAIRING_MODE_SELECTED', '[SIDESTORE_COREDEVICE] TRANSPORT_CREATE_PASS',
                     '[SIDESTORE_COREDEVICE] ENDPOINT_SELECT', '[SIDESTORE_COREDEVICE] LOCALVPN_UTUN_ACCEPTED',
                     '[SIDESTORE_COREDEVICE] JKTCP_MSS_CONFIG')
          for marker in markers:
              assert marker.encode() in executable, f'Embedded transport marker missing: {marker}'
          Path('artifacts/logs/embedded-transport-verification.txt').write_text(
              f'executable={embedded}\n' + '\n'.join(markers) + '\nverification=PASS\n')
          PY

      - name: Upload verified Scarlet & Crystal (NRG V192) IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-SideStore-v3.0.3-rc-IPA
          path: |
            artifacts/LiveContainer-SideStore-v3.0.3-rc.ipa
            artifacts/LiveContainer-SideStore-v3.0.3-rc.verification.json
            artifacts/LiveContainer-SideStore-v3.0.3-rc.runtime-verification.json
            artifacts/builder-commit.txt
            artifacts/debug-evidence/candidate-provenance.json
            artifacts/candidate-package-verification.json
            artifacts/logs/upstream-auth-provenance.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload source-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecontainer-autorefresh-build-evidence
          path: artifacts/logs
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve matching crash symbols and generated startup source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-v3-debug-evidence
          path: artifacts/debug-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Download uploaded candidate for delivery verification
        uses: actions/download-artifact@v4
        with:
          name: LiveContainer-SideStore-v3.0.3-rc-IPA
          path: artifacts/downloaded-ipa

      - name: Download uploaded source and symbol evidence
        uses: actions/download-artifact@v4
        with:
          name: combined-v3-debug-evidence
          path: artifacts/downloaded-debug-evidence

      - name: Verify the actual uploaded candidate and evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/verify_candidate_ipa.py \
            --ipa artifacts/downloaded-ipa/LiveContainer-SideStore-v3.0.3-rc.ipa \
            --provenance artifacts/downloaded-debug-evidence/candidate-provenance.json \
            --product v3.0.3-rc \
            --side-source work/EmbeddedSideStore \
            --builder-commit "$GITHUB_SHA" \
            --build-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output artifacts/downloaded-candidate-verification.json

  publish-nrg-ota:
    needs: source-and-host-build
    if: (github.ref_name == 'fix/nrg-v52-ota-inapp-20261019' || github.ref_name == 'fix/nrg-v53-orientation-geometry-20261019' || github.ref_name == 'fix/nrg-v54-guest-jit-geometry-20261019' || github.ref_name == 'fix/nrg-v56-notch-controls-20261019' || github.ref_name == 'fix/nrg-v57-ota-self-update-identity-20261019' || github.ref_name == 'fix/nrg-v58-native-island-fullscreen-20261019') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LiveContainer-SideStore-v3.0.3-rc-IPA
          path: dist
      - name: Verify and release unsigned IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd dist
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import os,plistlib,zipfile,hashlib
          p=Path('LiveContainer-SideStore-v3.0.3-rc.ipa')
          assert p.is_file() and 5000000 < p.stat().st_size < 350000000
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              app='Payload/LiveContainer.app/'
              info=plistlib.loads(z.read(app+'Info.plist'))
              assert info['CFBundleIdentifier']=='com.kdt.livecontainer'
              assert info['NRGOTASequence']==int(os.environ['GITHUB_RUN_NUMBER'])
              found={plistlib.loads(z.read(n))['CFBundleIdentifier'] for n in names
                     if n.startswith(app+'PlugIns/') and n.endswith('.appex/Info.plist')}
              expect={'com.kdt.livecontainer.'+x for x in ('LiveProcess','ShareExtension','LaunchAppExtension','LiveWidget')}
              assert found==expect
              assert info.get('NSSupportsLiveActivities') is True
              assert not any('/AltWidgetExtension.appex/' in n for n in names)
          value=hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
          Path(p.name+'.sha256').write_text(value+'  '+p.name+'\n')
          print('[NRG_V53_OTA] package_verified=1 sha256='+value)
          PY_CHECK
          tag="nrg-ota-v$GITHUB_RUN_NUMBER"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            LiveContainer-SideStore-v3.0.3-rc.ipa LiveContainer-SideStore-v3.0.3-rc.ipa.sha256 \
            --target "$GITHUB_SHA" --title "NRG V58 OTA $GITHUB_RUN_NUMBER" \
            --notes "Unsigned IPA with verified checksum and bundle IDs. Phone must sign with existing Apple team and upgrade same NRG bundle ID; do not uninstall. Build success does not prove iOS installation, JIT or memory."
