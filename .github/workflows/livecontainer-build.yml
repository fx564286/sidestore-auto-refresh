          assert changed == [relative], f"Unexpected Anisette source changes: {changed!r}"
          spec=importlib.util.spec_from_file_location("adi_patch", "builder/scripts/patch_v31_adi_45061.py")
          patch=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(patch)
          original=subprocess.check_output(
              ["git", "-C", str(root), "show", "HEAD:"+relative], text=True)
          actual=(root/relative).read_text(encoding="utf-8")
          assert actual == patch.patch(original), "V31 Anisette transform differs from pinned expected output"
          print("[PASS] V31 only the exact audited ADI recovery changes pinned Anisette sources")
          PY
