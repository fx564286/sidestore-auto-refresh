name: LiveContainer embedded SideStore build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'fast: test IPA with focused checks; release: full regression suite'
        required: true
        default: release
        type: choice
        options:
          - fast
          - release
  push:
    branches: [fix/combined-refresh-build-and-runtime, fix/v3.0.3-auth-errors, build/nrg-v3-ipa-priority-20261015, fix/nrg-cert-import-20261016, fix/nrg-jitless-cert-recovery-20261016, fix/nrg-jitless-auto-import-v17-20261017, fix/nrg-jitless-selfheal-v18, fix/nrg-cert-usb-bootstrap-v19, fix/nrg-cert-usb-bootstrap-v20, fix/nrg-refresh-correlation-v21, fix/nrg-v22-refresh-team-repair, fix/nrg-v23-direct-lockdown-refresh, fix/nrg-v24-refresh-install-recovery, fix/nrg-v25-rppairing-first-ios27, fix/nrg-v26-install-cancellation-trace, fix/nrg-v27-install-ui-lifecycle, fix/nrg-v28-refresh-regression, fix/nrg-v29-gsa-identity, fix/nrg-v30-auth-code3-rootcause, fix/nrg-v31-adi-45061-reprovision, fix/nrg-v32-jitless-cert-observation, fix/nrg-v33-iram-memory-integration, fix/nrg-v34-memory-display-profiles, fix/nrg-v45-settings-first-20261018, fix/nrg-v46-keyboard-window-scope-20261018, fix/nrg-v47-four-issue-recovery-20261018, fix/nrg-v48-madeira-runtime-20261018, fix/nrg-v49-jit-auto-return-20261019, fix/nrg-v50-stikdebug-pid-script-20261019, fix/nrg-v52-ota-inapp-20261019, fix/nrg-v53-orientation-geometry-20261019, fix/nrg-v54-guest-jit-geometry-20261019, fix/nrg-v55-display-watchdog-memory, fix/nrg-v56-notch-controls-20261019, fix/nrg-v57-ota-self-update-identity-20261019, fix/nrg-v58-native-island-fullscreen-20261019, fix/nrg-v192-scarlet-crashguard, audit/nrg-v199-ci-keychain-20261021, fix/nrg-v214-diagnostics-stikdebug-20261021, fix/nrg-brand-scarlet-crystal-20261021, experiment/nrg-v66-4-appids-20261022, experiment/nrg-v67-three-ids-api-20261022, experiment/nrg-v68-adaptive-appids-20261022, fix/nrg-v69-signing-udid-transport-20261022, fix/nrg-v70-portrait-bottom-safearea-20261022, fix/nrg-v72-overflow-longpress-20261022, fix/nrg-v73-apple-floating-control-20261022, audit/scarlet-unified-modernization-20261022, fix/scarlet-v75-retained-guest-reconcile-20261023, fix/scarlet-v76-in-guest-switch-all-modes-20261023, fix/scarlet-v77-profile-8220-device-registration-20261023, fix/scarlet-v78-liveprocess-null-pref-cache-20261024, fix/scarlet-v79-dyld-vtable-null-guard-20261024, fix/scarlet-v80-extensionlaunch-snapshot-recovery-20261024, experiment/scarlet-v80-xcode27-1-20261024, fix/scarlet-v81-ios272-arm64ex1-dsc-20261024, fix/scarlet-v82-safe-auth-preconnect-20261024, fix/scarlet-v83-xcode272-simulator-rescue-20261024, fix/scarlet-v84-xcode272-asset-catalog-20261024, fix/scarlet-v85-asset-leaf-copy-20261024, fix/scarlet-v86-verified-dead-guest-reconcile-20261024, fix/scarlet-v87-guest-button-switcher-20261024, refactor/scarlet-v88-canonical-guest-switcher-20261024, fix/scarlet-v89-availability-guard-20261024, fix/scarlet-v90-direct-return-explicit-20261024, fix/scarlet-v92-refresh-provisioning-cause-20261024, fix/scarlet-v93-profile-auth-typed-20261024, fix/scarlet-v94-profile-failure-compile-20261025, fix/scarlet-v95-wrapped-8220-recovery-20261025, fix/scarlet-v96-extension-profile-controls-20261025, fix/scarlet-v97-retained-guest-host-rebind-20261025, fix/scarlet-v98-auth80046-direct-ipa-20261025, fix/scarlet-v99-single-signin-symmetric-controls-20261025, fix/scarlet-v100-morph-guest-switcher-20261025, fix/scarlet-v102-recent-unification-20261025, fix/scarlet-v103-single-control-directswitch-20261025, fix/scarlet-v104-guest-scene-diagnostics-20261025, fix/scarlet-v105-delete-obsolete-return-20261025, fix/scarlet-v107-cleanup-release-20261025, fix/scarlet-v108-remove-blue-dock-20261025, fix/scarlet-v109-gsa-80045-20261025, fix/scarlet-v110-gsa503-guest-overlay-20261026, fix/scarlet-v111-canonical-switch-20261026, fix/scarlet-v112-direct-liveprocess-ui-parity-20261026, fix/scarlet-v113-auth-terminal-diagnostics-20261026, fix/scarlet-v114-direct-picker-20261026, fix/scarlet-v115-gsa-profile-coherence-20261026, fix/scarlet-v116-sideinstaller-parity-20261026, experiment/scarlet-v118-gsa-transaction-20261026, experiment/scarlet-v119-adi-origin-20261026, fix/scarlet-v120-anisette-selection-20261027, fix/scarlet-v121-anisette-v3-trace-20261027, fix/scarlet-v122-scoped-adi-reprovision-20261027, fix/scarlet-v123-reauth-provisioning-20261027, fix/scarlet-v124-geometry-refresh-20261027, fix/scarlet-v126-inplace-tabs-20261027, fix/scarlet-v127-complete-glass-signing-20261027, fix/scarlet-v128-direct-glass-nojit-20261027, fix/scarlet-v129-jit-viewport-20261027, fix/scarlet-v130-refresh-transport-20261027, fix/scarlet-v131-native-liquid-glass-20261027, fix/scarlet-v132-finger-glass-one-button-20261027, fix/scarlet-v133-keyboard-scene-focus-20261027, fix/scarlet-v134-jit-script-handoff-20261027, fix/scarlet-v135-jit-provider-regression-20261027, fix/scarlet-v136-rotation-atomic-20261027, fix/scarlet-v137-touch-glass-handle-20261027, fix/scarlet-v138-restore-functional-guest-control-20261028, fix/scarlet-v139-unified-touch-glass-landscape-20261028, fix/scarlet-v140-glass-pairing-20261028, fix/scarlet-v141-root-hittest-rotation-20261028, fix/scarlet-v142-pairing-route-race-20261028, fix/scarlet-v143-guest-window-edge-20261028, fix/scarlet-v144-interactive-glass-outside-tap-20261028, fix/scarlet-v147-restart-from-v144-20261028, fix/scarlet-v148-full-liquid-buttons-20261028, fix/scarlet-v149-controls-only-20261028, build/scarlet-fast-ci, fix/scarlet-v149-package-gate-20261028, fix/scarlet-v150-touch-glass-outside-20261028, fix/scarlet-v151-polish-geometry-20261028, fix/scarlet-v152-universal-geometry-20261028, fix/scarlet-v153-three-controls-20261029]

permissions:
  contents: read

concurrency:
  group: livecontainer-${{ github.ref }}
  cancel-in-progress: true

env:
  # Preserve release-level validation for ALL automatic branch pushes.
  # Only an explicit manual selection can bypass the long prepatch suite.
  SCARLET_CI_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'fast' && 'fast' || 'release' }}
  LIVE_CONTAINER_REF: 12377cf3b91d51739a33f14a302e5f522b238593
  EMBEDDED_SIDESTORE_REF: ff25922e5c13ccfafd83bda5092910d848ebd409
  MINIMUXER_REF: 98c3c79982f813878e922ab42f9545314a700f0c
  SIDESIGN_REF: a731c0d5a9a6617c7b385ae493e07ffb7f81cd5d
  SIDESIGN_GSA_FIX: 35993d7f68950ce00d6bf1fd0fbcaa7bef51dc9c
  IDEVICE_REF: ebd7dadfc55d1c4facee3d11ecf5b28e20548b57
  JKTCP_REF: e674e1eee6d5943e13b1eba0bd24a9dd0b2fa020

jobs:
  source-and-host-build:
    # V80 toolchain parity experiment: Apple Silicon Xcode 27 macOS runner.
    # This branch must not change the already-running V80 Xcode 26.4 baseline.
    # Same pinned app/SideStore sources and unsigned IPA; only toolchain changes.
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false

      # Execute before expensive upstream checkouts or Xcode builds. This
      # catches obsolete version/label greps that previously cost ~7 minutes.
      - name: Fast focused checks before patches
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/scarlet_ci_preflight.py --root builder
          ( cd builder && python3 -m unittest \
              tests.test_repository.RepositoryTests.test_current_files_exist \
              tests.test_ci_preflight \
              tests.test_v147_from_v144 \
              tests.test_v148_action_glass \
              tests.test_v149_controls \
              tests.test_v149_package_marker_parity \
              tests.test_v150_touch_glass \
              tests.test_v150_package_parity \
              tests.test_v151_geometry \
              tests.test_v151_glass_polish \
              tests.test_v151_package_parity \
              tests.test_v152_universal_guest_parity \
              tests.test_v153_three_fixes \
              tests.test_v153_package_parity -v )
          echo "[SCARLET_CI] profile=$SCARLET_CI_PROFILE fast_preflight=PASS"

      - name: Checkout pinned LiveContainer sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          git clone --filter=blob:none https://github.com/LiveContainer/LiveContainer.git work/LiveContainer
          git -C work/LiveContainer checkout --detach "$LIVE_CONTAINER_REF"
          git -C work/LiveContainer submodule update --init --recursive --depth=1

      - name: Checkout pinned embedded SideStore sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/LiveContainer/SideStore.git work/EmbeddedSideStore
          git -C work/EmbeddedSideStore checkout --detach "$EMBEDDED_SIDESTORE_REF"
          git -C work/EmbeddedSideStore submodule update --init --recursive --depth=1

      - name: Checkout pinned idevice
        uses: actions/checkout@v4
        with:
          repository: SideStore/idevice
          ref: ${{ env.IDEVICE_REF }}
          path: idevice
          fetch-depth: 1
          submodules: recursive

      - name: Checkout pinned jktcp
        uses: actions/checkout@v4
        with:
          repository: SideStore/jktcp
          ref: ${{ env.JKTCP_REF }}
          path: jktcp
          fetch-depth: 1

      - name: Verify exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C work/LiveContainer rev-parse HEAD)" = "$LIVE_CONTAINER_REF"
          test "$(git -C work/EmbeddedSideStore rev-parse HEAD)" = "$EMBEDDED_SIDESTORE_REF"
          test "$(git -C work/EmbeddedSideStore/Dependencies/minimuxer rev-parse HEAD)" = "$MINIMUXER_REF"
          test "$(git -C work/EmbeddedSideStore/Dependencies/SideSign rev-parse HEAD)" = "$SIDESIGN_REF"
          # Verify upstream resolution; never independently checkout or override SideSign.
          git -C work/EmbeddedSideStore/Dependencies/SideSign fetch --unshallow origin
          git -C work/EmbeddedSideStore/Dependencies/SideSign merge-base --is-ancestor "$SIDESIGN_GSA_FIX" HEAD
          printf 'sidestore=%s\nminimuxer=%s\nsidesign=%s\ngsa_fix_ancestor=%s\n' \
            "$EMBEDDED_SIDESTORE_REF" "$MINIMUXER_REF" "$SIDESIGN_REF" "$SIDESIGN_GSA_FIX" \
            | tee artifacts/logs/upstream-auth-provenance.txt
          test "$(git -C idevice rev-parse HEAD)" = "$IDEVICE_REF"
          test "$(git -C jktcp rev-parse HEAD)" = "$JKTCP_REF"

      - name: Select Xcode 27.2
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"

      - name: Verify Xcode 27.2 toolchain and iOS SDK provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          {
            echo "[SCARLET_V83_TOOLCHAIN] selected=27.2 expected_arch=arm64"
            uname -m
            xcodebuild -version
            xcodebuild -showsdks
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --find swiftc
            xcrun --find clang
            sw_vers
          } | tee artifacts/logs/v83-xcode-27.2-provenance.txt
          test "$(uname -m)" = "arm64"
          xcodebuild -version | grep -Fx "Xcode 27.2"
          xcrun --sdk iphoneos --show-sdk-version | grep -Fx "27.2"

      # Release keeps the unchanged 1,400+ test/skip-allowlist gate.
      # Fast still runs targeted checks plus the full compilation, archive,
      # Mach-O verification, IPA provenance and upload checks downstream.
      - name: Run repository checks before patches
        if: ${{ env.SCARLET_CI_PROFILE == 'release' }}
        env:
          LIVE_CONTAINER_TEST_SOURCE: ${{ github.workspace }}/work/LiveContainer
          SIDESTORE_TEST_SOURCE: ${{ github.workspace }}/work/EmbeddedSideStore
          EMBEDDED_SIDESTORE_TEST_SOURCE: ${{ github.workspace }}/work/EmbeddedSideStore
          SIDESIGN_TEST_SOURCE: ${{ github.workspace }}/work/EmbeddedSideStore/Dependencies/SideSign
          SIDESTORE_070_TEST_SOURCE: ${{ github.workspace }}/work/EmbeddedSideStore
          REQUIRE_SWIFT_070_CHECKS: "1"
          REQUIRE_PINNED_SOURCE_CLASSIFIER_TEST: "1"
        shell: bash
        run: |
          set -euo pipefail
          # V199: enforce the full repository regression suite, including new tests.
          # The test runner rejects unexpected skips and missing source coverage.
          # Pinned sources and Xcode have already been prepared above.
          python3 builder/scripts/run_required_tests.py \
            --start-directory builder/tests \
            --top-level-directory builder/tests \
            --pattern 'test_*.py' \
            --allowlist builder/scripts/required_test_skip_allowlist.json \
            --verbosity 2 2>&1 | tee artifacts/logs/repository-tests.log

      # Fail on generated Swift/configuration errors BEFORE compiling Rust/iOS.
      - name: Apply and verify host integration
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 builder/scripts/patch_livecontainer_autorefresh.py work/LiveContainer
            python3 builder/scripts/patch_livecontainer_autorefresh.py work/LiveContainer
            python3 builder/scripts/patch_embedded_sidestore_startup.py work/LiveContainer work/EmbeddedSideStore
            python3 builder/scripts/patch_embedded_sidestore_startup.py work/LiveContainer work/EmbeddedSideStore
            # V81: iOS 27.2 RC / arm64e.x1 DSC path was omitted in the
            # previously pinned litehook 8025e0c. Port upstream a7e9f599
            # without changing original LC/SideStore revisions or guest data.
            python3 builder/scripts/patch_v81_arm64ex1_litehook.py work/LiveContainer
            python3 builder/scripts/patch_v81_arm64ex1_litehook.py work/LiveContainer
            grep -Fq '"_arm64e_x1",' work/LiveContainer/litehook/src/litehook.c
            V81_LITEHOOK_PATCHED=1 LIVE_CONTAINER_TEST_SOURCE=work/LiveContainer python3 -m unittest discover -s builder/tests -p test_v81_arm64ex1_litehook.py -v
            # V78: prevent iOS 27.2 LiveProcess NUDGuestHooksInit NULL symbol crash.
            # Pinned CF private symbols may vanish; preserve all other V1-V77 patches.
            python3 builder/scripts/patch_v78_nud_symbol_crashguard.py work/LiveContainer
            python3 builder/scripts/patch_v78_nud_symbol_crashguard.py work/LiveContainer
            V78_PATCHED_LIVECONTAINER=1 LIVE_CONTAINER_TEST_SOURCE=work/LiveContainer python3 -m unittest discover -s builder/tests -p test_v78_nud_symbol_crashguard.py -v
            # V79: iOS 27.2 LiveProcess dlopen_nolock+596 dereferenced NULL private vtable.
            python3 builder/scripts/patch_v79_dyld_vtable_crashguard.py work/LiveContainer
            python3 builder/scripts/patch_v79_dyld_vtable_crashguard.py work/LiveContainer
            V79_PATCHED_LIVECONTAINER=1 LIVE_CONTAINER_TEST_SOURCE=work/LiveContainer python3 -m unittest discover -s builder/tests -p test_v79_dyld_vtable_crashguard.py -v
            python3 builder/scripts/patch_guest_return.py work/LiveContainer
            python3 builder/scripts/patch_guest_return.py work/LiveContainer
            # V76: share V72 recent guest switcher with native LiveProcess
            # Return control, while V73 ellipsis owns the virtual-window path.
            python3 builder/scripts/patch_v76_native_guest_switcher.py work/LiveContainer
            python3 builder/scripts/patch_v76_native_guest_switcher.py work/LiveContainer
            V76_PATCHED_LIVECONTAINER=1 LIVE_CONTAINER_TEST_SOURCE=work/LiveContainer python3 -m unittest discover -s builder/tests -p test_v76_native_guest_switcher.py -v
            # V75: allow late scene registration a bounded reconciliation
            # window without ever clearing a genuinely active owner.
            python3 builder/scripts/patch_v75_retained_guest_reconcile.py work/LiveContainer
            python3 builder/scripts/patch_v75_retained_guest_reconcile.py work/LiveContainer
            V75_PATCHED_LIVECONTAINER=1 LIVE_CONTAINER_TEST_SOURCE=work/LiveContainer python3 -m unittest discover -s builder/tests -p test_v75_retained_guest_reconcile.py -v
            # V86: only a positive kernel ESRCH result can clear a lost-window
            # registration; a live/unknown PID remains protected from relaunch.
            python3 builder/scripts/patch_v86_verified_dead_guest_reconcile.py work/LiveContainer
            python3 builder/scripts/patch_v86_verified_dead_guest_reconcile.py work/LiveContainer
            V86_PATCHED_LIVECONTAINER=1 LIVE_CONTAINER_TEST_SOURCE=work/LiveContainer python3 -m unittest discover -s builder/tests -p test_v86_verified_dead_guest_reconcile.py -v
            python3 builder/scripts/patch_dead10cc_fix.py work/LiveContainer
            python3 builder/scripts/patch_dead10cc_fix.py work/LiveContainer
            python3 builder/scripts/patch_multitask_dock.py work/LiveContainer
            python3 builder/scripts/patch_multitask_dock.py work/LiveContainer
            # V27: end prior guest keyboard editing and avoid scaled frame persistence.
            python3 builder/scripts/patch_v27_guest_switch.py work/LiveContainer
            python3 builder/scripts/patch_v27_guest_switch.py work/LiveContainer
            # V28: actual remote scene keyboard + audio background lifecycle, PiP exempt.
            python3 builder/scripts/patch_v28_guest_lifecycle.py work/LiveContainer
            python3 builder/scripts/patch_v28_guest_lifecycle.py work/LiveContainer
            # V28: verify the REAL generated scene, PiP and focus contract.
            # The earlier repository sweep verifies the pristine-source
            # prerequisite without attempting V28 on unpatched V27 sources.
            V28_PATCHED_LIVECONTAINER=work/LiveContainer \
              LIVE_CONTAINER_TEST_SOURCE=work/LiveContainer \
              python3 -m unittest discover -s builder/tests -p test_v28_guest_lifecycle.py -v
            # V46: correct owning UIWindow, no global keyboard responder resign.
            python3 builder/scripts/patch_v46_keyboard_window_scope.py work/LiveContainer
            python3 builder/scripts/patch_v46_keyboard_window_scope.py work/LiveContainer
            swiftc -frontend -parse work/LiveContainer/MultitaskSupport/MultitaskDockView.swift
            V46_PATCHED_LIVECONTAINER=work/LiveContainer python3 -m unittest discover -s builder/tests -p test_v46_keyboard_window_scope.py -v
            # V47: restore visible retained guest scenes after iOS host activation.
            python3 builder/scripts/patch_v47_resume.py work/LiveContainer
            python3 builder/scripts/patch_v47_resume.py work/LiveContainer
            swiftc -frontend -parse work/LiveContainer/MultitaskSupport/MultitaskDockView.swift
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/App/AppDelegate.swift
            # V28: querying PiP does not activate the host playback audio session.
            python3 builder/scripts/patch_v28_pip_audio.py work/LiveContainer
            python3 builder/scripts/patch_v28_pip_audio.py work/LiveContainer
            python3 builder/scripts/patch_app_layout.py --v3-grid work/LiveContainer
            python3 builder/scripts/patch_app_layout.py --v3-grid work/LiveContainer
            # V57: fix OTA self identity and UI build labels before source generation.
            python3 builder/scripts/patch_v57_ota_identity.py builder
            python3 builder/scripts/patch_v57_ota_identity.py builder
            python3 builder/scripts/patch_v3_unified_shell.py work/LiveContainer work/EmbeddedSideStore
            python3 builder/scripts/patch_v3_unified_shell.py work/LiveContainer work/EmbeddedSideStore
            # V123: unavailable provisioning sessions must offer explicit reauthentication.
            python3 -m unittest discover -s builder/tests -p test_v123_provisioning_reauth_ui.py -v
            python3 -m unittest discover -s builder/tests -p test_v124_rotation_geometry.py -v
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/V3UnifiedShell.swift
            grep -Fq 'SCARLET_V123_REAUTH_RECOVERY' work/LiveContainer/LiveContainerSwiftUI/Views/V3UnifiedShell.swift
            python3 builder/scripts/patch_lc_certificate_observation.py work/LiveContainer
            python3 builder/scripts/patch_lc_certificate_observation.py work/LiveContainer
            # V32: independently expose offline signed certificate facts and OCSP status.
            python3 builder/scripts/patch_v32_jitless_diagnosis.py work/LiveContainer
            python3 builder/scripts/patch_v32_jitless_diagnosis.py work/LiveContainer
            swiftc -frontend -parse work/LiveContainer/LiveContainerSwiftUI/Views/Settings/LCJITLessDiagnoseView.swift
            python3 builder/scripts/patch_v3_service.py work/LiveContainer work/EmbeddedSideStore
            python3 builder/scripts/patch_v3_service.py work/LiveContainer work/EmbeddedSideStore
            # V113: terminal failures must include the same bounded typed
            # diagnostic category/code/type as the intermediate auth prompt.
            # No Apple response bodies, account data, or retries are added.
            grep -Fq 'SCARLET_V113_TERMINAL_AUTH_DIAGNOSTICS' work/EmbeddedSideStore/AltStore/AppDelegate.swift
            grep -Fq 'wire["diagnosticCode"] = safeCode' work/EmbeddedSideStore/AltStore/AppDelegate.swift
            # V24: recover transient URLSession -999 on source IPA installs
            # but preserve actual user and parent-operation cancellation.
            python3 builder/scripts/patch_v24_install_download.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v24_install_download.py work/EmbeddedSideStore
            # V26: trace actual native step and cancellation origin, do not bypass user cancellation.
            python3 builder/scripts/patch_v26_install_trace.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v26_install_trace.py work/EmbeddedSideStore
            # V69: prevent transient RemotePairing/UDID loss inside self-resign.
            # Bounded retries; never guess a device ID or bypass Apple signing.
            python3 builder/scripts/patch_v69_signing_udid_retry.py work/EmbeddedSideStore
            python3 builder/scripts/patch_v69_signing_udid_retry.py work/EmbeddedSideStore
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/PipelineOperations/ResignAppOperation.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/StandaloneOperations/DownloadAppOperation.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/PipelineExecutor.swift
            swiftc -frontend -parse work/EmbeddedSideStore/SideStore/Core/Operations/PipelineRunner.swift
            python3 builder/scripts/patch_v34_display_profiles.py work/LiveContainer
            python3 builder/scripts/patch_v34_display_profiles.py work/LiveContainer
            python3 builder/scripts/patch_v36_multitask_chrome.py work/LiveContainer
            python3 builder/scripts/patch_v36_multitask_chrome.py work/LiveContainer
            python3 builder/scripts/patch_v37_window_overflow.py work/LiveContainer
            python3 builder/scripts/patch_v37_window_overflow.py work/LiveContainer
            python3 builder/scripts/patch_v38_maximized_safe_area.py work/LiveContainer
            python3 builder/scripts/patch_v38_maximized_safe_area.py work/LiveContainer
            python3 builder/scripts/patch_v39_dock_app_switch_only.py work/LiveContainer
            python3 builder/scripts/patch_v39_dock_app_switch_only.py work/LiveContainer
            python3 builder/scripts/patch_v41_remove_floating_return.py work/LiveContainer
            python3 builder/scripts/patch_v41_remove_floating_return.py work/LiveContainer
            # V46 Madeira JIT: return to launchable host app, not LiveProcess.appex.
            python3 builder/scripts/patch_v46_jit_host_bundle.py work/LiveContainer
            python3 builder/scripts/patch_v46_jit_host_bundle.py work/LiveContainer
            grep -Fq 'NRG_V46_JIT_HOST_BUNDLE_RETURN' work/LiveContainer/LiveContainer/LCBootstrap.m
            # V48: log actual host/LiveProcess JIT attach and signed memory grant.
            python3 builder/scripts/patch_v48_madeira_runtime_probe.py work/LiveContainer
