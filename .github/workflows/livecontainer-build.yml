          archive="$RUNNER_TEMP/V78.xcarchive"
          # Gate 1 still runs a full archive with the same Xcode compile cache.
          python3 builder/scripts/run_bounded_build.py \
            --log artifacts/logs/v78-archive.log --timeout-seconds 1500 -- \
            xcodebuild -project work/LiveContainer/LiveContainer.xcodeproj -showBuildTimingSummary -jobs 2 \
            -scheme LiveContainer -configuration Release \
            -destination 'generic/platform=iOS' -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/livecontainer-derived-data" \
            -archivePath "$archive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO archive
          app="$archive/Products/Applications/LiveContainer.app"
          binary="$app/Frameworks/LiveContainerShared.framework/LiveContainerShared"
          extension="$app/PlugIns/LiveProcess.appex/LiveProcess"
          test -d "$app" && test -f "$binary" && test -f "$extension"
          {
            echo '[V78_GATE1] archive_present=1'
            echo '[V78_GATE1] LiveContainerShared LC_UUID:'
            xcrun dwarfdump --uuid "$binary"
            echo '[V78_GATE1] LiveContainerShared slices:'
            xcrun lipo -info "$binary"
            xcrun lipo -archs "$binary" | tr ' ' '\n' | grep -Fx arm64
            echo '[V78_GATE1] LiveProcess LC_UUID:'
            xcrun dwarfdump --uuid "$extension"
            echo '[V78_GATE1] UUID must differ from original 9f35e8b4-af78-357f-9df2-2b3f715ce203'
            ! xcrun dwarfdump --uuid "$binary" | grep -i '9f35e8b4-af78-357f-9df2-2b3f715ce203'
            echo '[V79_GATE1] UUID must differ from V78 crashed 6CF93852-434F-3087-BCBE-862E60B804D8'
            ! xcrun dwarfdump --uuid "$binary" | grep -i '6cf93852-434f-3087-bcbe-862e60b804d8'
            echo '[V79_GATE1] dlopen_nolock private-vtable NULL crash guarded by source regression'
            echo '[V78_GATE1] unsigned_archive=PASS; signed_entitlements=NOT_TESTED'
          } | tee artifacts/logs/v78-archive-verification.txt

      - name: Upload V78 archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scarlet-v78-archive-evidence
          path: |
            artifacts/logs/v78-archive.log
            artifacts/logs/v78-archive-verification.txt
            artifacts/logs/v78-gate1-environment.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload source-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecontainer-autorefresh-build-evidence
          path: artifacts/logs
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve matching crash symbols and generated startup source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-v3-debug-evidence
          path: artifacts/debug-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Download uploaded candidate for delivery verification
        uses: actions/download-artifact@v4
        with:
          name: LiveContainer-SideStore-v3.0.3-rc-IPA
          path: artifacts/downloaded-ipa

      - name: Download uploaded source and symbol evidence
        uses: actions/download-artifact@v4
        with:
          name: combined-v3-debug-evidence
          path: artifacts/downloaded-debug-evidence

      - name: Verify the actual uploaded candidate and evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 builder/scripts/verify_candidate_ipa.py \
            --ipa artifacts/downloaded-ipa/LiveContainer-SideStore-v3.0.3-rc.ipa \
            --provenance artifacts/downloaded-debug-evidence/candidate-provenance.json \
            --product v3.0.3-rc \
            --side-source work/EmbeddedSideStore \
            --builder-commit "$GITHUB_SHA" \
            --build-run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output artifacts/downloaded-candidate-verification.json

      # Direct IPA is an additional verified deliverable. Keep the existing
      # multi-file ZIP artifact and download-based provenance gate unchanged.
      - name: Record CI validation profile
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/logs
          printf 'profile=%s\nsource_sha=%s\nfull_regression=%s\n' \
            "$SCARLET_CI_PROFILE" "$GITHUB_SHA" \
            "$([ "$SCARLET_CI_PROFILE" = release ] && echo required || echo NOT_RUN_FAST_PROFILE)" \
            > artifacts/logs/scarlet-ci-profile.txt
          cat artifacts/logs/scarlet-ci-profile.txt

      - name: Upload CI validation profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scarlet-ci-validation-profile
          path: artifacts/logs/scarlet-ci-profile.txt
          if-no-files-found: error
          retention-days: 30

      - name: Stage verified V153 IPA for direct download
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/downloaded-ipa/LiveContainer-SideStore-v3.0.3-rc.ipa \
             artifacts/Scarlet-Crystal-V153-UNSIGNED.ipa
          cmp artifacts/downloaded-ipa/LiveContainer-SideStore-v3.0.3-rc.ipa \
              artifacts/Scarlet-Crystal-V153-UNSIGNED.ipa
          shasum -a 256 artifacts/Scarlet-Crystal-V153-UNSIGNED.ipa

      - name: Upload directly downloadable Scarlet Crystal V153 IPA
        uses: actions/upload-artifact@v7
        with:
          name: Scarlet-Crystal-V153-${{ env.SCARLET_CI_PROFILE }}-UNSIGNED
          path: artifacts/Scarlet-Crystal-V153-UNSIGNED.ipa
          archive: false
          if-no-files-found: error
          retention-days: 7

  publish-nrg-ota:
    needs: source-and-host-build
    if: (github.ref_name == 'fix/nrg-v52-ota-inapp-20261019' || github.ref_name == 'fix/nrg-v53-orientation-geometry-20261019' || github.ref_name == 'fix/nrg-v54-guest-jit-geometry-20261019' || github.ref_name == 'fix/nrg-v56-notch-controls-20261019' || github.ref_name == 'fix/nrg-v57-ota-self-update-identity-20261019' || github.ref_name == 'fix/nrg-v58-native-island-fullscreen-20261019') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LiveContainer-SideStore-v3.0.3-rc-IPA
          path: dist
      - name: Verify and release unsigned IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          cd dist
          python3 - <<'PY_CHECK'
          from pathlib import Path
          import os,plistlib,zipfile,hashlib
          p=Path('LiveContainer-SideStore-v3.0.3-rc.ipa')
          assert p.is_file() and 5000000 < p.stat().st_size < 350000000
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              app='Payload/LiveContainer.app/'
              info=plistlib.loads(z.read(app+'Info.plist'))
              assert info['CFBundleIdentifier']=='com.kdt.livecontainer'
              assert info['NRGOTASequence']==int(os.environ['GITHUB_RUN_NUMBER'])
              found={plistlib.loads(z.read(n))['CFBundleIdentifier'] for n in names
                     if n.startswith(app+'PlugIns/') and n.endswith('.appex/Info.plist')}
              expect={'com.kdt.livecontainer.'+x for x in ('LiveProcess','ShareExtension')}
              assert found==expect
              assert info.get('NSSupportsLiveActivities') is not True
              assert not any('/AltWidgetExtension.appex/' in n for n in names)
          value=hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
          Path(p.name+'.sha256').write_text(value+'  '+p.name+'\n')
          print('[NRG_V53_OTA] package_verified=1 sha256='+value)
          PY_CHECK
          tag="nrg-ota-v$GITHUB_RUN_NUMBER"
          gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            LiveContainer-SideStore-v3.0.3-rc.ipa LiveContainer-SideStore-v3.0.3-rc.ipa.sha256 \
            --target "$GITHUB_SHA" --title "Scarlet Crystal V72 OTA $GITHUB_RUN_NUMBER" \
            --notes "Unsigned IPA with verified checksum and bundle IDs. Phone must sign with existing Apple team and upgrade same NRG bundle ID; do not uninstall. Build success does not prove iOS installation, JIT or memory."
