name: Scarlet V187 native authCancel nonblocking regression
on:
  push:
    branches: [fix/scarlet-v187-service-auth-cancel-nonblocking-20261105]
    paths:
      - '.github/workflows/scarlet-v187-auth-smoke.yml'
      - 'scripts/templates/v3_headless_runtime.swift'
      - 'scripts/templates/v3_sidestore_service.swift'
      - 'tests/test_v3_service.py'
      - 'tests/test_v187_service_auth_cancel_nonblocking.py'
  pull_request:
    paths:
      - '.github/workflows/scarlet-v187-auth-smoke.yml'
      - 'scripts/templates/v3_headless_runtime.swift'
      - 'scripts/templates/v3_sidestore_service.swift'
      - 'tests/test_v3_service.py'
      - 'tests/test_v187_service_auth_cancel_nonblocking.py'
permissions:
  contents: read
jobs:
  service-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate service cancellation and auth state source contracts
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p test_v187_service_auth_cancel_nonblocking.py -v
          python3 -m unittest discover -s tests -p test_v182_p00_auth_cancel.py -v
          python3 -m unittest discover -s tests -p test_v184_auth_cancel_outcomes.py -v
          python3 -m unittest discover -s tests -p test_v185_auth_owner_preflight.py -v
          python3 -m unittest discover -s tests -p test_v186_auth_start_outcome.py -v
