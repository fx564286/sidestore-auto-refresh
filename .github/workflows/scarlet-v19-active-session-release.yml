name: Scarlet V19 active guest session only direct IPA

on:
  push:
    branches:
      - fix/scarlet-v19-active-session-switcher-20261110
    paths:
      - .github/workflows/scarlet-v19-active-session-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  package-verified-v19:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download actual V19 compiled LiveContainer native engine
        uses: actions/download-artifact@v4
        with:
          name: Scarlet-LiveContainer-Native-Engine
          path: artifacts/lc
          run-id: 42705430477
          github-token: ${{ github.token }}
      - name: Reuse exact pinned and already compiled SideStore from V16
        uses: actions/download-artifact@v4
        with:
          name: Scarlet-SideStore-Native-Engine
          path: artifacts/side
          run-id: 42685084334
          github-token: ${{ github.token }}
      - name: Fail closed on source/pin mismatches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          pins=json.loads(Path("config/scarlet-upstream-pins.json").read_text())
          side=json.loads(Path("artifacts/side/source-gitlink-audit.json").read_text())
          assert side["sourcePins"]==pins, "Cached SideStore source pins changed"
          host=json.loads(Path("artifacts/lc/scarlet-host-integration.json").read_text())
          files={Path(x["path"]).name:x["sha256"] for x in host["sources"]}
          expected=("ScarletIndependentShell.swift","ScarletIntegratedHostView.swift",
                    "ScarletFullscreenGuestTab.swift","ScarletGuestSwitcherOverlay.swift",
                    "ScarletGuestSessionLedger.swift","ScarletNativeGlass.swift",
                    "ScarletSigningReadinessPanel.swift","ScarletAutomaticRenewal.swift",
                    "ScarletFeatureModulesSection.swift")
          for filename in expected:
              path=Path("rebuild/Sources/ScarletIndependentUI" if
                        filename=="ScarletIndependentShell.swift" else "rebuild/HostApp")/filename
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              assert files.get(filename)==digest, f"Not the V19 compiled code: {filename}"
          assert Path("artifacts/side/SideStore.ipa").stat().st_size>1_000_000
          assert Path("artifacts/lc/LiveContainer-app.tar").stat().st_size>1_000_000
          print("[PASS] V19 exact compiled source hashes and pinned SideStore engine")
          PY
      - name: Prepare official LiveContainer integrated packager
        shell: bash
        run: |
          set -Eeuo pipefail
          brew install ldid
          mkdir -p report build-tools
          curl -fLSs --retry 5 --retry-all-errors --retry-delay 3 \
            https://github.com/LiveContainer/dylibify/releases/download/1.0/dylibify \
            -o build-tools/dylibify
          printf '6d23f6a2fc4d8442f87caa1161aebe6ecaafd0e8c41ce205da007efb04fc82c7  build-tools/dylibify\n' | shasum -a 256 -c -
          chmod +x build-tools/dylibify
          pin="$(python3 -c 'import json;print(json.load(open("config/scarlet-upstream-pins.json"))["LIVE_CONTAINER_REF"])')"
          curl -fLSs --retry 3 \
            "https://raw.githubusercontent.com/LiveContainer/LiveContainer/$pin/.github/sidelc/LCAppInfo.plist" \
            -o build-tools/LCAppInfo.plist
          plutil -lint build-tools/LCAppInfo.plist
      - name: Package and strictly verify V19 unified unsigned IPA
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 rebuild/integration/package_paired.py \
            --lc-tar artifacts/lc/LiveContainer-app.tar \
            --sidestore-ipa artifacts/side/SideStore.ipa \
            --lc-appinfo build-tools/LCAppInfo.plist \
            --dylibify build-tools/dylibify \
            --host-report artifacts/lc/scarlet-host-integration.json \
            --out report
          python3 rebuild/integration/verify_engines.py \
            --phase combined \
            --combined-ipa report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa \
            --report report/combined-ipa-verification.json
          python3 rebuild/scripts/audit_appid_footprint.py \
            --ipa report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa \
            --out report/scarlet-app-id-footprint.json
          cp report/Scarlet-LiveContainer+SideStore-ENGINES-UNSIGNED.ipa Scarlet-Crystal-V19-UNSIGNED.ipa
          shasum -a 256 Scarlet-Crystal-V19-UNSIGNED.ipa > Scarlet-Crystal-V19-UNSIGNED.ipa.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("report/scarlet-app-id-footprint.json").read_text())
          print("[APP ID AUDIT]", report)
          assert report["total_bundle_ids"]==4,"Unexpected Apple App ID footprint"
          assert Path("Scarlet-Crystal-V19-UNSIGNED.ipa").stat().st_size>20_000_000
          PY
      - name: Publish permanent direct Safari IPA link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag=scarlet-v19-active-session-switcher-20261110
          cat > release-notes.md <<'EOF'
          Scarlet Crystal V19 — show only current guest switcher session entries.

          LiveContainer is compiled on Xcode 27.2 from exact V19 source
          commit 620a6096ebb801d0b130c5541cbffcd13e294e1b
          (paired run 42705430477). The unchanged pinned SideStore engine
          binary is reused from the audited V16 paired native build.
          Exact source hashes and upstream pins are checked before packaging.

          Fix: the old V14 ever-launched list (up to 24) is no longer read
          by the switcher. V19 uses a distinct bounded active work session
          (up to 8 entries, 30-minute per-entry cold-tab expiry).
          A run -> Home -> B run keeps A/B in the same active session.
          Installing a guest alone never creates a switcher row.
          A shared data container cannot make every guest appear 'current'.

          Existing V14 history is preserved for rollback; no guest data,
          certificates, app identities or signing profiles were changed.
          Original Liquid Glass and V17 rotation/cold relaunch are unchanged.
          Four app IDs: Host, LiveProcess, ShareExtension, LaunchAppExtension.

          UNSIGNED IPA. Requires valid Apple signing/provisioning.
          This code build does not prove real iPhone A/B switching or
          7-day Apple renewal.
          EOF
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target 620a6096ebb801d0b130c5541cbffcd13e294e1b \
              --title "Scarlet Crystal V19 — current guest sessions only — UNSIGNED" \
              --prerelease --latest=false --notes-file release-notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            Scarlet-Crystal-V19-UNSIGNED.ipa Scarlet-Crystal-V19-UNSIGNED.ipa.sha256 \
            report/scarlet-app-id-footprint.json --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'Scarlet-Crystal-V19-UNSIGNED.ipa'
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Scarlet-Crystal-V19-UNSIGNED.ipa" >> "$GITHUB_STEP_SUMMARY"
