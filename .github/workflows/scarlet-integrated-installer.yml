name: Scarlet Crystal Integrated Installer QA
on:
  push:
    branches: [fix/scarlet-v166-integrated-setup-20261101]
    paths:
      - 'installer/**'
      - 'tests/test_integrated_setup.py'
      - '.github/workflows/scarlet-integrated-installer.yml'
  workflow_dispatch:
jobs:
  integrated-first-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed installer/unit tests
        run: |
          python3 -m compileall -q installer
          python3 -m unittest discover -s tests -p 'test_integrated_setup.py' -v
          bash -n installer/activate-integrated-install.sh
      - name: Package into one update archive
        run: |
          mkdir -p dist/Scarlet-Crystal-Integrated-Installer
          cp installer/scarlet_oneclick.py installer/install_integration.py installer/activate-integrated-install.sh dist/Scarlet-Crystal-Integrated-Installer/
          tar -czf dist/Scarlet-Crystal-Integrated-Installer-V166.tar.gz -C dist Scarlet-Crystal-Integrated-Installer
          sha256sum dist/*.tar.gz > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Scarlet-Crystal-Integrated-Installer-V166
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
