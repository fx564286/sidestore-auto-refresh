name: Scarlet Crystal NEW PROJECT - clean source tests

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/scarlet-from-zero-20261106
    paths:
      - 'rebuild/**'
      - '.github/workflows/scarlet-clean-core.yml'
  pull_request:
    branches:
      - rebuild/scarlet-from-zero-20261106
    paths:
      - 'rebuild/**'
      - '.github/workflows/scarlet-clean-core.yml'

permissions:
  contents: read

concurrency:
  group: scarlet-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify clean-room scope and pinned project identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path("rebuild/Sources/ScarletCleanCore/ScarletActionCoordinator.swift").read_text()
          t=Path("rebuild/Tests/ScarletCleanCoreContract.swift").read_text()
          # The new core must never import or call the old V3 bridge directly.
          assert "V3ServiceBridge" not in s
          assert "LiveContainer" not in s
          assert "Keychain" not in s
          assert "ScarletLocalActionDriver" in s and "ScarletServiceActionDriver" in s
          assert "serviceUnavailable" in s and "signInRequired" in s
          assert "SCARLET_CLEAN_CORE_LOCAL_CONTROLS_WORK_WITHOUT_SERVICE" in t
          print("[PASS] CLEAN_CORE_ISOLATED_FROM_LEGACY_V3")
          PY
      - name: Verify independent UI design boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool rebuild/config/scarlet-independent-ui-contract.json >/dev/null
          python3 -m unittest discover -s rebuild/Tests -p 'test_*.py' -v
          python3 -m py_compile rebuild/tools/renewal_policy.py
          python3 -m unittest discover -s rebuild/Tests -p 'test_scarlet_upstream_candidate.py' -v
      - name: Compile pure Swift 6 source and run executable behavioral contract
        shell: bash
        run: |
          set -euo pipefail
          command -v swiftc >/dev/null
          swiftc -version
          swiftc -swift-version 6 -parse-as-library \
            rebuild/Sources/ScarletCleanCore/ScarletActionCoordinator.swift \
            rebuild/Sources/ScarletCleanCore/ScarletControlAuditTrail.swift \
            rebuild/Tests/ScarletCleanCoreContract.swift \
            -o "${RUNNER_TEMP}/scarlet-clean-core-contract"
          "${RUNNER_TEMP}/scarlet-clean-core-contract"
          swiftc -swift-version 6 -parse-as-library \
            rebuild/Sources/ScarletCleanCore/ScarletActionCoordinator.swift \
            rebuild/Sources/ScarletCleanCore/ScarletControlAuditTrail.swift \
            rebuild/Tests/ScarletActionAuditContract.swift \
            -o "${RUNNER_TEMP}/scarlet-audit-contract"
          "${RUNNER_TEMP}/scarlet-audit-contract"
          swiftc -swift-version 6 -parse-as-library \
            rebuild/Sources/ScarletCleanCore/ScarletUpdateCoordinator.swift \
            rebuild/Tests/ScarletUpdateCoordinatorContract.swift \
            -o "${RUNNER_TEMP}/scarlet-update-contract"
          "${RUNNER_TEMP}/scarlet-update-contract"
          swiftc -swift-version 6 -parse-as-library \
            rebuild/Sources/ScarletCleanCore/ScarletRefreshPolicy.swift \
            rebuild/Tests/ScarletRefreshPolicyContract.swift \
            -o "${RUNNER_TEMP}/scarlet-refresh-contract"
          "${RUNNER_TEMP}/scarlet-refresh-contract"
      - name: Save actual test output
        if: failure()
        shell: bash
        run: |
          echo "[FAIL] Clean-room integration cannot be promoted until tests pass."


  release-readiness-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate evidence-based design/glass/device release report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 rebuild/scripts/audit_readiness.py --output reports/scarlet-release-readiness.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("reports/scarlet-release-readiness.json"))
          print("### Scarlet Crystal release readiness: "+d["currentStatus"])
          print("| Check | Status |")
          print("| --- | --- |")
          for c in d["checks"]:
              print("| "+c["id"]+" | "+c["status"]+" |")
          print("\nA UI simulator screenshot and SwiftUI typecheck do NOT prove native Liquid Glass or installation.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Scarlet-Clean-Release-Readiness-JSON
          path: reports/scarlet-release-readiness.json
          retention-days: 14
          if-no-files-found: warn

  swiftui-ios-typecheck:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode for real iOS SwiftUI availability
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"
      - name: Typecheck independent shell against iOS simulator SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator swiftc -swift-version 6 \
            -target arm64-apple-ios17.0-simulator -sdk "$sdk" -typecheck \
            rebuild/Sources/ScarletCleanCore/ScarletActionCoordinator.swift \
            rebuild/Sources/ScarletCleanCore/ScarletControlAuditTrail.swift \
            rebuild/Sources/ScarletCleanCore/ScarletUpdateCoordinator.swift \
            rebuild/Sources/ScarletCleanCore/ScarletRefreshPolicy.swift \
            rebuild/Sources/ScarletIndependentUI/ScarletIndependentShell.swift
          echo '[PASS] SCARLET_INDEPENDENT_UI_SWIFTUI_IOS_TYPECHECK'

  simulator-ui-screenshots:
    needs: [swiftui-ios-typecheck]
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2 simulator runtime
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"
      - name: Capture five iPhone Simulator SwiftUI screenshots (mock glass disclosed)
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          bash rebuild/scripts/capture_simulator_ui.sh "$RUNNER_TEMP/scarlet-design-screenshots"
      - name: Upload visible screenshot evidence and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Scarlet-Clean-UI-Figma-Parity-Simulator-Only
          path: ${{ runner.temp }}/scarlet-design-screenshots/
          if-no-files-found: warn
          retention-days: 14
