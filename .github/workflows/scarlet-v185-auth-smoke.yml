name: Scarlet Crystal V185 auth owner smoke tests
on:
  push:
    branches:
      - fix/scarlet-v185-auth-owner-preflight-20261104
    paths:
      - '.github/workflows/scarlet-v185-auth-smoke.yml'
      - 'scripts/patch_v185_auth_owner_preflight.py'
      - 'tests/test_v185_auth_owner_preflight.py'
  pull_request:
    paths:
      - '.github/workflows/scarlet-v185-auth-smoke.yml'
      - 'scripts/patch_v185_auth_owner_preflight.py'
      - 'tests/test_v185_auth_owner_preflight.py'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and deterministic auth state tests
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/patch_v185_auth_owner_preflight.py
          python3 -m unittest discover -s tests -p 'test_v185_auth_owner_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_v184_auth_cancel_outcomes.py' -v
